function placementRound() {
  document.getElementById('dailyRow').style.display = 'none';
  const L = PLAYABLE.find((P2) => P2.id === TIERS[placement.tierIdx].top);
  const choices = keyChoices(L).filter((c) => !String(c.value).startsWith('sym:'));
  const choice = choices[placement.item % choices.length];
  const round = buildRound(L, choice.value, Math.floor(Math.random() * 1e6));
  currentRoundInfo = {
    keyLabel: choice.label,
    meter: (round.melody && round.melody.meter) || L.meter,
    bars: (round.recipe && round.recipe.active && round.recipe.active.bars) || L.lengthBars || 2,
    mode: round.rendererKind,
    ...roundAnalysis(round),
  };
  const labelCtx = { key: round.key, mode: round.mode, system: document.getElementById('sysSel').value, minorSolfege: 'la' };
  const services = createServices({ labelNoteFn: labelNote, labelPaletteFn: labelPalette, labelCtx, tempoBPM: 92 });
  lastServices = services;
  if (currentRenderer) currentRenderer.destroy();
  document.getElementById('toast').textContent = '';
  const oldStars = document.querySelector('.melodic-stars');
  if (oldStars) oldStars.remove();
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('hudLevelNum').textContent = '';
  document.getElementById('hudLevelTitle').textContent = 'Placement check';
  document.getElementById('hudGoal').textContent =
    TIERS[placement.tierIdx].label + ' · question ' + (placement.item + 1) + ' / ' + PLACEMENT_ITEMS + ' — pick the staff that matches what you hear';
  const host = document.getElementById('rendererHost');
  // Assessment uses RECOGNITION regardless of the level's own mode (the doc's
  // "easiest mode" rule keeps the test about EARS, not interface skill).
  currentRenderer = RENDERERS.recognition(host, {
    level: L, melody: round.melody, distractors: round.distractors, labelCtx, services,
    practice: true, // assessment is NO-FAIL and unhurried — no hearing budget here
    onResult(result) { placementResult(result); },
  });
  if (window.__mqTest) window.__mqTest.lastRound = round;
  if (hasGesture) services.play(round.melody);
}

function placementResult(result) {
  if (result.correct) placement.correct++;
  placement.item++;
  if (placement.item < PLACEMENT_ITEMS) { setTimeout(placementRound, 900); return; }
  // Assessment complete.
  const rate = placement.correct / PLACEMENT_ITEMS;
  const tier = TIERS[placement.tierIdx];
  if (rate >= PLACEMENT_PASS) {
    // Owner's rule: a passed check means you START AT that level — the tested
    // tier is where real work begins (everything below is marked proficient).
    const topIdx = PLAYABLE.findIndex((P2) => P2.id === tier.top);
    const placedIdx = Math.min(topIdx, PLAYABLE.length - 1);
    // Mark everything below as proficient-or-better — idempotent, never demotes.
    for (let i = 0; i < placedIdx; i++) {
      const id = PLAYABLE[i].id;
      const item = itemFor(id);
      if ((item.score || 0) < 85) S.items[id] = { ...item, score: 85, level: 'proficient' };
    }
    S.levelIdx = placedIdx;
    S.xp += 25; // placement completion is a genuine mastery event
    placement = null;
    save(S);
    showOverlay({
      heading: 'Placed!',
      sub: 'You start at ' + curLevel().id.toUpperCase() + ' · ' + curLevel().title + ' (' + Math.round(rate * 100) + '% on the check). Everything below is unlocked.',
      buttonText: 'Begin',
      onGo: newRound,
    });
  } else if (placement.tierIdx > 1) {
    const downTo = placement.tierIdx - 1;
    placement = null;
    showOverlay({
      heading: 'Close! Let\u2019s check one tier down',
      sub: 'That level isn\u2019t comfortable yet (' + Math.round(rate * 100) + '%). No worries — quick check of "' + TIERS[downTo].label + '" instead.',
      buttonText: 'Continue',
      onGo: () => startPlacement(downTo),
    });
  } else {
    placement = null;
    S.levelIdx = 0; save(S);
    showOverlay({
      heading: 'Starting from the beginning',
      sub: 'The foundations will go fast — the ladder climbs quickly.',
      buttonText: 'Begin',
      onGo: newRound,
    });
  }
}

function newRound() {
  // Studio drives its own round loop — no review interception, no intro cards
  // (the student explicitly chose this material; leave via the same button).
  if (studioSpec) { startRound(); return; }
  const due = review.dueItems(S.review, Date.now());
  // Gym spaced-review (spec §2): a due 'gym:<circuit>' surfaces FIRST, as that
  // circuit's NAME station — a one-station retention probe, not a whole re-grind.
  const dueGym = due.find((d) => String(d.skillId).startsWith('gym:'));
  if (dueGym) { startGymReview(String(dueGym.skillId).slice(4)); return; }
  const dueLadder = due.find((d) => !String(d.skillId).startsWith('gym:'));
  const dueLevel = dueLadder ? PLAYABLE.find((P) => P.id === dueLadder.skillId) : null;
  if (dueLevel && dueLevel.id !== curLevel().id) {
    reviewingLevel = dueLevel;
    startRound();
    return;
  }
  reviewingLevel = null;

  const L = curLevel();
  renderHud(); // the header reflects the level IMMEDIATELY (intro card included),
               // not only once a round mounts — jumping levels showed a stale title.
  // First visit to a level (this device): show its intro card BEFORE the first
  // round — the curriculum's own title + goal, so the student knows what skill
  // this rung teaches. Once per level, persisted.
  // FORCE_INTRO (?intro=1) — testing aid: show the teaching modal on EVERY level entry,
  // not just the first time (owner: "for testing can we have modals pop up each time").
  if (S.introSeen !== L.id && (FORCE_INTRO || !(S.introDone || []).includes(L.id))) {
    S.introSeen = L.id;
    (S.introDone = S.introDone || []).push(L.id);
    save(S);
    showLevelIntro(L, 'Start', startRound);
    return;
  }
  startRound();
}

function startRound() {
  // A new round owns the screen: clear any overlay left from a previous state
  // (level intro / level-up) — overlays must never stack over a fresh round.
  document.querySelectorAll('.melodic-overlay').forEach((el) => el.remove());
  if (gymStationMount) { gymStationMount.destroy(); gymStationMount = null; gymReviewCircuit = null; }
  if (bookendMount) { bookendMount.destroy(); bookendMount = null; }
  if (chunkMount) { chunkMount.destroy(); chunkMount = null; }
  document.getElementById('dailyRow').style.display = '';
  // A GYM daily runs through startDailyGym, not here — treat it as no ladder daily.
  const dailyIsLadder = dailyActive != null && dailyChallenges()[dailyActive].type !== 'gym';
  const L = dailyIsLadder ? PLAYABLE[dailyChallenges()[dailyActive].levelIdx] : (reviewingLevel || curLevel());
  // Rotate through the level's whole key set (the multi-key research made real):
  // every key the level allows comes up in turn, not just the primary.
  const choices = keyChoices(L);
  let choice = choices[roundKeyRotation % choices.length];
  roundKeyRotation++;
  let dailySpec = null;
  if (dailyActive != null) {
    dailySpec = dailyChallenges()[dailyActive];
  }
  const seed = dailySpec ? dailySpec.seed : Math.floor(Math.random() * 1e6);
  // CAPSTONE round (mastery-progression-model, LOCKED): once the band+streak gate is
  // met, advancement demands ONE clean LONGER example of this level's own exercise —
  // 4 bars (8 from M17, the multi-phrase span). Reviews are never capstones.
  currentIsCapstone = !reviewingLevel && !studioSpec && S.capstoneArmed;
  const capstoneBars = L.mIndex >= 17 ? 8 : 4;
  // DICTATION DEPTH (§C3 D1): rounds rotate through the level's WHOLE meter set
  // (like keys) and GROW with mastery — 2 bars while learning, alternating 2/4
  // in the middle band, 4 (8 at M17+) once Proficient. Dailies pin the level's
  // primary meter + 2 bars (their seed must fully determine the round). The
  // Studio overrides all three knobs with the student's own picks.
  const meterSet = L.meters || [L.meter];
  let meter = meterSet[roundMeterRotation % meterSet.length];
  roundMeterRotation++;
  const viewNow = mastery.viewItemAsOf(itemFor(L.id), Date.now());
  // Length (audit §A3): the level's own MATERIAL length is the standard (doc:
  // M14 = 4-bar phrases, M17/M26 = 8-bar); below Familiar it scaffolds at half.
  // 2-bar levels stretch to 4 once Proficient (variety, not a requirement).
  const baseBars = L.lengthBars || 2;
  let bars;
  if (baseBars > 2) bars = viewNow.score < 40 ? Math.max(2, baseBars / 2) : baseBars;
  // MONOTONIC length ramp (no jarring 2<->4 alternation): stay at 2 bars until the student is near
  // mastery, then lengthen to 4. Difficulty within a length is handled by the adaptive percentile below.
  else bars = viewNow.score >= 70 ? 4 : 2;
  // ADAPTIVE difficulty percentile: buildRound generates several candidate melodies and picks the one
  // at this percentile, so difficulty CLIMBS with mastery instead of swinging random-easy/random-hard.
  // Floored (always some challenge) and capped (never punishing); the capstone uses near-max.
  const diffPct = Math.max(0.12, Math.min(0.95, viewNow.score / 100));
  // Exercise-mode PROGRESSION (audit §A1, doc §2/§3): below Familiar = the
  // easiest prescribed mode; the middle band rotates ALL prescribed modes; at
  // Proficient the hardest leads. The capstone is always the hardest mode.
  const modes = L.exerciseModes || [L.exerciseMode];
  let exMode = viewNow.score < 40 ? modes[0]
    : viewNow.score >= 80 ? modes[modes.length - 1]
    : modes[roundModeRotation % modes.length];
  roundModeRotation++;
  // Hall rhythm chapters (audit §A2): the doc prescribes a RANGE — rotate it.
  const refs = L.hallRhythmRefs || [L.hallRhythmRef];
  let hallRef = refs[roundRefRotation % refs.length];
  roundRefRotation++;
  // LEVEL 4 (m2): gate rhythm complexity + meter by the STAGE (not mastery rotation), so a
  // beginner is never sprung the hardest chapter/meter on round 2. Within a stage's UNLOCKED
  // set we still interleave (good for retention). See stacking-principle / M2_* constants.
  if (L.id === 'm2') {
    const st = S.stages.m2 || 0;
    const sRefs = M2_HALLREFS[st] || M2_HALLREFS[M2_HALLREFS.length - 1];
    const sMeters = M2_METERS[st] || M2_METERS[M2_METERS.length - 1];
    hallRef = sRefs[roundRefRotation % sRefs.length];
    meter = sMeters[roundMeterRotation % sMeters.length];
    // (mode is always rhythm-identity for m2; the name/shape STEP is gated by identityPhase below)
  }
  // STAGE-LADDER GATING (data-driven): for a level in STAGE_LADDERS, stage the generated vocabulary
  // (opts.degrees / opts.leaps) + rhythm ref by S.stages[id]. Renderer unchanged. Folds in L1–4 per the
  // stacking spine; every stage stays within DEGREE/LEAP_INTRO_MINDEX (verified in SEMITONES).
  let stageDegrees = null, stageLeaps = null;
  const stageLad = STAGE_LADDERS[L.id];
  if (stageLad) {
    const st = S.stages[L.id] || 0;
    const at = (arr) => arr ? (arr[st] || arr[arr.length - 1]) : null;
    stageDegrees = at(stageLad.degrees);
    stageLeaps = at(stageLad.leaps);
    const sRefs = at(stageLad.hallRefs);
    if (sRefs) hallRef = sRefs[roundRefRotation % sRefs.length];
  }
  if (dailySpec) { // dailies stay fully seed-determined: pin every rotating knob
    meter = L.meter; bars = Math.min(baseBars, 4); exMode = L.exerciseMode; hallRef = L.hallRhythmRef;
  }
  if (studioSpec) {
    choice = studioSpec.choice; meter = studioSpec.meter; bars = studioSpec.bars;
    exMode = studioSpec.exMode || modes[0];
  }
  const capBars = Math.max(capstoneBars, baseBars);
  const round = buildRound(L, choice.value, seed,
    currentIsCapstone
      ? { lengthBars: capBars, meter, exerciseMode: modes[modes.length - 1], hallRhythmRef: hallRef, degrees: stageDegrees, leaps: stageLeaps, difficultyPercentile: 0.92 }
      : { lengthBars: bars, meter, exerciseMode: exMode, hallRhythmRef: hallRef, degrees: stageDegrees, leaps: stageLeaps, difficultyPercentile: diffPct });
  currentRoundInfo = {
    keyLabel: choice.label,
    meter: (round.melody && round.melody.meter) || meter,
    bars: currentIsCapstone ? capBars : bars,
    // coverage records what ACTUALLY mounted (sym/modulating force recognition);
    // m20's three rungs are all faces of its single 'two-part' mode.
    mode: L.exerciseMode === 'two-part' ? 'two-part' : round.rendererKind,
    ...roundAnalysis(round),
  };

  const isDiatonic = !String(choice.value).startsWith('sym:');
  const labelCtx = {
    key: round.key, mode: isDiatonic ? round.mode : 'major',
    system: document.getElementById('sysSel').value, minorSolfege: 'la',
  };
  currentLabelCtx = labelCtx; // HUD pips/goals read this so they follow the Labels toggle
  const services = createServices({ labelNoteFn: labelNote, labelPaletteFn: labelPalette, labelCtx, tempoBPM: 92 });
  lastServices = services;

  if (currentRenderer) currentRenderer.destroy();
  document.getElementById('toast').textContent = '';
  const oldStars = document.querySelector('.melodic-stars');
  if (oldStars) oldStars.remove();
  document.getElementById('nextBtn').style.display = 'none';

  const host = document.getElementById('rendererHost');
  const m0Stage = S.stages[L.id] || 0;
  // For M0 tile stages, tell the renderer this round's PACE + label (normal vs the
  // faster speed-ramp rounds) based on how many clean rounds are already banked.
  let tileStepMs, tileRoundLabel, tileRoundDone, tileRoundTotal, tileSpeed;
  if (L.id === 'm0' && m0Stage >= 2) {
    const done = S.m0StagePass || 0;
    const plan = M0_TILE_PLAN[m0Stage];
    tileStepMs = m0RoundStepMs(m0Stage, done);
    tileRoundLabel = m0RoundLabel(m0Stage, done);
    if (plan) { tileRoundDone = done; tileRoundTotal = plan.normal + plan.speeds.length; tileSpeed = done >= plan.normal; }
  }
  // M1 stage 2 (shape-picker) grows BOTH the melody length (3->6 notes) AND the number of
  // decoy shapes (3->6 options) as the fluent streak builds — robust, not a quick pass.
  let shapeLen, shapeOptions;
  if (L.id === 'm1' && m0Stage === 2) {
    const fs = S.m1FluentStreak || 0;
    shapeLen = Math.min(6, 3 + Math.floor(fs / 3));
    shapeOptions = Math.min(6, 3 + Math.floor(fs / 4));
  }
  // Two-note stages get a progressive REFERENCE schedule (stable -> shifting -> every example).
  let m1Refs;
  if (L.id === 'm1' && m0Stage < 2) { m1Refs = m1TwoNoteRefs(6); save(S); }
  // LEVEL 3 (m1_5) memory-span ladder: span + content rule + tempo + reverse per stage.
  let spanCount, spanGapMs, spanReverse, spanRule;
  if (L.id === 'm1_5') {
    const st = m0Stage; // S.stages['m1_5']
    spanCount = M15_SPAN[st]; spanReverse = st === 3; spanRule = M15_RULES[st];
    spanGapMs = Math.max(360, M15_GAP[st] - (S.m15Streak || 0) * 30); // tempo tightens as the streak builds
  }
  currentRenderer = RENDERERS[round.rendererKind](host, {
    level: L, melody: round.melody, distractors: round.distractors, labelCtx, services,
    practice: !!(S.practice),
    progress: mastery.viewItemAsOf(itemFor(L.id), Date.now()),
    stage: m0Stage, // EXPLICIT in-level stage (M0: 0 live · 1 live-quick · 2 tap-1̂ · 3 tap-3̂ · 4 tap-5̂)
    tileStepMs, tileRoundLabel, tileRoundDone, tileRoundTotal, tileSpeed, shapeLen, shapeOptions, m1Refs,
    spanCount, spanGapMs, spanReverse, spanRule,
    identityPhase: L.id === 'm2' && (S.stages.m2 || 0) >= M2_IDENTITY_STAGE, // Level 4 stage 3 adds name/shape
    onResult(result) { onRoundResult(L, result); },
  });
  // Test seam only (?mqtest=1): expose the round truth so automated tests can
  // answer CORRECTLY through the real UI (mirrors the rhythm game's __levTest).
  if (window.__mqTest) window.__mqTest.lastRound = round;
  renderHud();
  // The round OPENS by sounding its melody (hear-then-answer modes only, and only
  // once a user gesture has unlocked audio) — a dictation game must never sit
  // silent waiting for the student to discover a Play button (owner-reported).
  // In graded mode the 3-hearing budget must be exact, so the round no longer
  // auto-plays — the student spends hearing #1 deliberately. Practice mode keeps
  // the friendlier auto-play.
  if (hasGesture && S.practice && AUTOPLAY_KINDS.has(round.rendererKind)) {
    services.play(round.melody);
  }
}

// One daily's reward bookkeeping — shared by ladder dailies and the Gym daily
// (spec §6) so both grant the identical +10 gems / +5 XP / +150 and streak.
function applyDailyResult(i, result) {
  const toastEl = document.getElementById('toast');
  if (result.correct) {
    S.daily.done[i] = true;
    S.gems += 10; S.xp += 5; S.score += 150;
    const allDone = S.daily.done.every(Boolean);
    if (allDone) { S.daily.streak++; playFanfare(); }
    toastEl.className = 'melodic-toast is-correct';
    toastEl.textContent = allDone
      ? 'All three dailies done — day streak ' + S.daily.streak + '!  (+10 gems · +5 XP · +150)'
      : 'Daily complete!  +10 gems · +5 XP · +150';
  } else {
    toastEl.className = 'melodic-toast is-wrong';
    toastEl.textContent = encourage() + ' — dailies stay open all day';
  }
  save(S); renderDaily(); renderHud();
  if (result.correct) celebrate(result.clean !== false); else playTryAgain();
  document.getElementById('nextBtn').style.display = '';
}

function onRoundResult(L, result) {
  const now = Date.now();
  if (dailyActive != null) {
    const i = dailyActive;
    dailyActive = null;
    applyDailyResult(i, result);
    return;
  }
  S.items[L.id] = mastery.recordAnswer(itemFor(L.id), !!result.correct, { now, sessionStart: S.sessionStart });

  // DICTATION DEPTH (§C3 D2): every graded round feeds the level's coverage map —
  // which keys and meters have been answered CORRECTLY, how many rounds total,
  // and whether one long (4-bar+) round was clean. Advancement reads this.
  const cov = covFor(L.id);
  cov.rounds++;
  if (result.correct && currentRoundInfo) {
    if (currentRoundInfo.keyLabel) cov.keys[currentRoundInfo.keyLabel] = true;
    if (currentRoundInfo.meter) cov.meters[currentRoundInfo.meter] = true;
    if (currentRoundInfo.mode) cov.modes[currentRoundInfo.mode] = true;
    if (currentRoundInfo.bars >= 4 && result.clean !== false) cov.longClean = true;
  }

  // STUDIO rounds (§C3 D3): mastery + coverage + score, but NEVER the advancement
  // streak or capstone — the guided ladder owns progression.
  if (studioSpec) {
    let pts0 = 0;
    if (result.correct) pts0 = 100;
    else if (Number.isFinite(result.accuracy) && result.accuracy > 0) pts0 = Math.round(result.accuracy);
    S.score += pts0;
    if (result.correct) S.xp += 1;
    session.rounds++;
    if (result.correct) session.correct++;
    save(S);
    renderHud();
    if (pts0) scorePop(pts0);
    if (result.correct) celebrate(result.clean !== false); else playTryAgain();
    const toastEl = document.getElementById('toast');
    toastEl.className = 'melodic-toast ' + (result.correct ? 'is-correct' : 'is-wrong');
    toastEl.textContent = (result.correct ? 'Studio round correct' : encourage()) +
      ' · ' + currentRoundInfo.bars + ' bars · ' + currentRoundInfo.keyLabel + ' · ' + currentRoundInfo.meter;
    document.getElementById('nextBtn').style.display = '';
    return;
  }

  // REVIEW rounds feed the Leitner boxes + refresh the level's mastery decay —
  // they never touch the CURRENT level's advancement streak (a retention lapse
  // demotes the review box; it shouldn't also punish today's new-skill progress).
  if (reviewingLevel) {
    S.review.entries = S.review.entries.map((e) =>
      e.skillId === L.id ? review.applyResult(e, !!result.correct, now) : e);
    if (result.correct) { S.reviewsPassed++; S.score += 50; S.xp += 1; checkAchievements(); celebrate(result.clean !== false); } else playTryAgain();
    save(S);
    renderHud();
    session.rounds++;
    if (result.correct) session.correct++;
    const toastEl = document.getElementById('toast');
    toastEl.className = 'melodic-toast ' + (result.correct ? 'is-correct' : 'is-wrong');
    toastEl.textContent = result.correct
      ? 'Review passed — ' + levelLabel(L) + ' stays sharp'
      : 'Review lapse — ' + levelLabel(L) + ' will come around again sooner';
    document.getElementById('nextBtn').style.display = '';
    return;
  }

  S.streak = result.correct && result.clean !== false ? S.streak + 1 : 0;
  S.bestStreak = Math.max(S.bestStreak, S.streak);
  // M0's FIVE-stage progression (owner redesign): 0 live find-home · 1 live find-home
  // (quick) · 2 tap HOME in tiles · 3 tap 3̂ · 4 tap 5̂. The two LIVE stages own their
  // reps internally, so each completion (one clean result) advances. The TILE stages
  // need several clean rounds (M0_TILE_PLAN) — home is a light mechanic intro; 3̂/5̂ ask
  // 5 clean rounds + a 3-round speed ramp so the skill is real, not one lucky round.
  // A missed round never RESETS the tally; it just doesn't count (kept encouraging).
  let stageAdvanced = false;
  let tileProgress = null; // {done,total,label} when a clean tile round doesn't yet advance
  if (L.id === 'm0' && !currentIsCapstone && result.correct && result.clean !== false) {
    const cur2 = S.stages.m0 || 0;
    if (cur2 <= 1 || cur2 === 5) {
      // LIVE stages clear on one clean session: 0/1 find-home, 5 octave-equivalence.
      if (cur2 < 5) { S.stages.m0 = cur2 + 1; S.m0StagePass = 0; stageAdvanced = true; }
      // cur2 === 5 cleared: final stage done — the capstone gate takes it from here.
    } else {
      const plan = M0_TILE_PLAN[cur2];
      const total = plan ? plan.normal + plan.speeds.length : 1;
      S.m0StagePass = (S.m0StagePass || 0) + 1;
      if (S.m0StagePass >= total && cur2 < 4) {
        S.stages.m0 = cur2 + 1; S.m0StagePass = 0; stageAdvanced = true;
      } else if (S.m0StagePass >= total && cur2 === 4) {
        S.stages.m0 = 5; S.m0StagePass = 0; stageAdvanced = true; // tiles done -> octave-equivalence stage
      } else if (S.m0StagePass < total) {
        tileProgress = { done: S.m0StagePass, total, label: m0RoundLabel(cur2, S.m0StagePass) };
      }
    }
  }
  // M1 CONTOUR — FLUENCY GATE (owner, pilot): advance a stage only after K FLUENT hits
  // IN A ROW, where fluent = correct AND answered within the stage's time threshold. A
  // slow OR wrong answer resets the streak (mastery = automaticity, not just accuracy).
  // Runs on EVERY M1 round (even wrong ones) so a miss can reset the streak. The per-
  // answer times ride in result.meta.prompts = [{correct, rt}], processed in order.
  if (L.id === 'm1' && !currentIsCapstone) {
    const c1 = S.stages.m1 || 0;
    const K = (c1 === 2) ? M1_SHAPE_K : M1_FLUENT_K;
    const thr = M1_FLUENT_MS[c1] || 3000;
    const seq = (result.meta && result.meta.prompts) || [];
    for (const pr of seq) {
      if (pr.correct && pr.rt <= thr) S.m1FluentStreak = (S.m1FluentStreak || 0) + 1;
      else S.m1FluentStreak = 0;
      if (c1 < 2 && S.m1FluentStreak >= K) { S.stages.m1 = c1 + 1; S.m1FluentStreak = 0; stageAdvanced = true; break; }
      if (c1 === 2 && S.m1FluentStreak >= K) { S.m1ShapeDone = true; } // shape mastered; capstone can arm
    }
    if (!stageAdvanced) {
      const inRow = c1 === 2 ? ' shapes in a row' : ' fast in a row';
      tileProgress = { done: Math.min(S.m1FluentStreak || 0, K), total: K, label: M1_STAGE_NAMES[c1] + ' — ' + (S.m1FluentStreak || 0) + '/' + K + inRow };
    }
  }
  // LEVEL 3 (m1_5) MEMORY-SPAN LADDER — advance a stage on K clean echoes IN A ROW; a miss
  // resets the streak and, after M15_MISS_REGRESS misses, steps the stage back down (so a
  // student who slips to a harder span isn't stranded). Stage 3 (reverse) mastered = m15Done,
  // which arms the level capstone.
  if (L.id === 'm1_5' && !currentIsCapstone) {
    const cs = S.stages['m1_5'] || 0;
    if (result.correct) {
      S.m15Streak = (S.m15Streak || 0) + 1; S.m15Miss = 0;
      if (cs < 3 && S.m15Streak >= M15_K) { S.stages['m1_5'] = cs + 1; S.m15Streak = 0; stageAdvanced = true; }
      else if (cs === 3 && S.m15Streak >= M15_K) { S.m15Done = true; }
    } else {
      S.m15Streak = 0; S.m15Miss = (S.m15Miss || 0) + 1;
      if (cs > 0 && S.m15Miss >= M15_MISS_REGRESS) { S.stages['m1_5'] = cs - 1; S.m15Miss = 0; }
    }
    if (!stageAdvanced) {
      const cur = S.stages['m1_5'] || 0;
      tileProgress = { done: Math.min(S.m15Streak || 0, M15_K), total: M15_K, label: M15_STAGE_NAMES[cur] + ' — ' + (S.m15Streak || 0) + '/' + M15_K + ' in a row' };
    }
  }
  // LEVEL 4 (m2) RHYTHM LADDER — advance a stage on M2_K clean rhythm passes IN A ROW; a wrong
  // pass resets the streak (mastery = automaticity). Caps at the last built stage; the capstone
  // gate takes over there. (Integration stages fold in L1/L2 as their renderers land.)
  if (L.id === 'm2' && !currentIsCapstone) {
    const cs = S.stages.m2 || 0;
    if (result.correct && result.clean !== false) {
      S.m2Streak = (S.m2Streak || 0) + 1;
      if (cs < M2_LAST_STAGE && S.m2Streak >= M2_K) { S.stages.m2 = cs + 1; S.m2Streak = 0; stageAdvanced = true; }
    } else {
      S.m2Streak = 0;
    }
    if (!stageAdvanced) {
      const cur = S.stages.m2 || 0;
      tileProgress = { done: Math.min(S.m2Streak || 0, M2_K), total: M2_K, label: M2_STAGE_NAMES[cur] + ' — ' + (S.m2Streak || 0) + '/' + M2_K + ' in a row' };
    }
  }
  // STAGE-LADDER ADVANCEMENT (data-driven) — advance a stage on K clean answers IN A ROW; a wrong pass
  // resets the streak (mastery = automaticity). Caps at the last stage; the capstone gate takes over.
  const advLad = STAGE_LADDERS[L.id];
  if (advLad && !currentIsCapstone) {
    const last = advLad.names.length - 1;
    const cs = S.stages[L.id] || 0;
    S.stageStreaks = S.stageStreaks || {};
    if (result.correct && result.clean !== false) {
      S.stageStreaks[L.id] = (S.stageStreaks[L.id] || 0) + 1;
      if (cs < last && S.stageStreaks[L.id] >= advLad.K) { S.stages[L.id] = cs + 1; S.stageStreaks[L.id] = 0; stageAdvanced = true; }
    } else {
      S.stageStreaks[L.id] = 0;
    }
    if (!stageAdvanced) {
      const cur = S.stages[L.id] || 0;
      const n = S.stageStreaks[L.id] || 0;
      tileProgress = { done: Math.min(n, advLad.K), total: advLad.K, label: advLad.names[cur] + ' — ' + n + '/' + advLad.K + ' in a row' };
    }
  }
  // VOLATILE SCORE (RhythmQuest's economy, per research/LEVEL_SYSTEM_RESEARCH.md's decoupled
  // currencies): accuracy-scaled base + a clean-streak combo bonus. Untimed —
  // never speed-scored. A wrong answer earns nothing but never subtracts (mastery
  // already applies the learning penalty; score is the thrill meter, not the gate).
  let pts = 0;
  if (result.correct) {
    pts = 100 + (result.clean !== false ? (S.streak - 1) * 20 : 0);
  } else if (Number.isFinite(result.accuracy) && result.accuracy > 0) {
    pts = Math.round(result.accuracy); // partial credit for per-note modes
  }
  S.score += pts;
  S.levelScore += pts;
  S.levelRounds++;
  if (result.correct && result.clean !== false) S.levelClean++;
  if (result.correct) S.xp += 1; // XP: +1 per correct (mastery events add +50)
  // Session stats read the streak NOW — before the advancement gate resets it.
  session.rounds++;
  if (result.correct) session.correct++;
  session.bestStreak = Math.max(session.bestStreak, S.streak);
  const roundUnlocks = checkAchievements();
  scorePop(pts);
  if (result.correct) celebrate(result.clean !== false); // confetti + sparkle on every win
  roundUnlocks.forEach((a, i) => setTimeout(() => achievementBanner(a), i * 900));
  // EARLY REWARD (pre-student polish): make the very FIRST correct answer feel
  // like an event, so a brand-new student gets a win in their first minute.
  if (result.correct && !S.firstCorrectShown) {
    S.firstCorrectShown = true; save(S);
    achievementBanner({ name: 'First one right', desc: 'you’re already hearing it!' });
  }

  const view = mastery.viewItemAsOf(S.items[L.id], now);
  const toast = document.getElementById('toast');
  let advanced = false;
  let capstoneArmedNow = false;
  const clean = result.correct && result.clean !== false;
  if (currentIsCapstone) {
    if (clean) {
      advanced = S.levelIdx < PLAYABLE.length - 1;
      S.capstoneArmed = false;
      if (advanced) { S.levelIdx++; S.streak = 0; }
    } else {
      // Capstone missed: the gate resets — rebuild the streak, earn another shot
      // (one lucky run can't pass you; that's the locked model's whole point).
      S.capstoneArmed = false;
      S.streak = 0;
    }
  } else if (!S.capstoneArmed && view.score >= PROFICIENT_FLOOR && S.streak >= ADVANCE_STREAK
             && S.levelIdx < PLAYABLE.length - 1
             && (L.id !== 'm0' || (S.stages.m0 || 0) >= 5) // M0: all six stages first (incl. octave equivalence)
             && (L.id !== 'm1' || ((S.stages.m1 || 0) >= 2 && S.m1ShapeDone)) // M1: all 3 stages + shape robustly mastered
             && (L.id !== 'm1_5' || ((S.stages['m1_5'] || 0) >= 3 && S.m15Done)) // Level 3: all 4 stages incl. reverse
             && (L.id !== 'm2' || (S.stages.m2 || 0) >= M2_LAST_STAGE) // Level 4: all rhythm stages first
             && (!STAGE_LADDERS[L.id] || (S.stages[L.id] || 0) >= STAGE_LADDERS[L.id].names.length - 1) // staged levels: all stages first
             && coverageComplete(L)) { // D2: the WHOLE vocabulary, not 3 quick wins
    S.capstoneArmed = true;
    capstoneArmedNow = true;
  }
  // Band + streak met but coverage still open: say exactly what's left, so the
  // demand reads as a checklist, not a mystery stall.
  let coverageHint = null;
  if (!S.capstoneArmed && !currentIsCapstone && result.correct
      && view.score >= PROFICIENT_FLOOR && S.streak >= ADVANCE_STREAK && !coverageComplete(L)) {
    const { keysNeeded, metersNeeded, modesNeeded } = coverageNeeds(L);
    const missing = [];
    const kGot = Object.keys(cov.keys).length;
    if (kGot < keysNeeded) missing.push('keys ' + kGot + '/' + keysNeeded);
    const mGot = metersNeeded.filter((m) => cov.meters[m]).length;
    if (mGot < metersNeeded.length) missing.push('meters ' + mGot + '/' + metersNeeded.length);
    const xGot = modesNeeded.filter((m) => (cov.modes || {})[m]).length;
    if (xGot < modesNeeded.length) missing.push('exercises ' + xGot + '/' + modesNeeded.length);
    if (cov.rounds < MIN_LEVEL_ROUNDS) missing.push('rounds ' + cov.rounds + '/' + MIN_LEVEL_ROUNDS);
    if (!cov.longClean) missing.push('one clean long round');
    coverageHint = 'Skill band met — now cover the level: ' + missing.join(' · ');
  }
  save(S);
  renderHud();
  if (typeof syncLevelJump === 'function') syncLevelJump();

  if (advanced) {
    session.levelUps++;
    S.levelUps++;
    // MASTERY EVENT rewards (the doc's formulas): +50 XP; gems = 25 + score/120
    // for the level's run + 5 clean-play bonus at >=95% clean rounds.
    S.xp += 50;
    const cleanRate = S.levelRounds ? S.levelClean / S.levelRounds : 0;
    const gemsEarned = masteryEventGems(S.levelScore, cleanRate);
    S.gems += gemsEarned;
    const levelUnlocks = checkAchievements({ cleanLevelUp: cleanRate >= 0.95 });
    levelUnlocks.forEach((a, i) => setTimeout(() => achievementBanner(a), 600 + i * 900));
    const earnedLine = '+50 XP · +' + gemsEarned + ' gems' +
      (levelUnlocks.length ? ' · Achievement: ' + levelUnlocks.map((a) => a.name).join(', ') : '');
    S.levelScore = 0; S.levelRounds = 0; S.levelClean = 0;
    celebrate(true);
    playFanfare();
    // The PASSED level enters the spaced-review rotation (one entry per level).
    // createEntry marks a skill due IMMEDIATELY (built for session composition);
    // here the level was literally just answered, so its FIRST review belongs a
    // full box-1 interval out (1 day) — not interrupting the very next round.
    if (!S.review.entries.some((e) => e.skillId === L.id)) {
      S.review.entries.push({ ...review.createEntry(L.id, now), dueAt: now + review.BOX_INTERVALS_MS[1] });
    }
    const NL = curLevel();
    // The level-up overlay doubles as the NEW level's intro (so it isn't shown twice).
    (S.introDone = S.introDone || []).push(NL.id);
    save(S);
    const nt = (window.MELODIC_TEACH_CONTENT || {})[NL.id] || {};
    // Announce any PRACTICE mode that just unlocked at this new level (it used to appear silently).
    const newlyUnlocked = practiceModes().filter((m) => m.gate > L.mIndex && m.gate <= NL.mIndex).map((m) => m.name);
    showOverlay({
      heading: 'Level up!',
      sub: 'Next: ' + levelLabel(NL) + ' · ' + (nt.title || NL.title) +
        (nt.whatsNew ? ' — ' + nt.whatsNew : ''),
      goal: NL.masteryGoal,
      bullets: nt.listenFor,
      strategy: nt.strategy,
      stats: (newlyUnlocked.length ? 'New in Practice: ' + newlyUnlocked.join(', ') + '\n' : '') +
        earnedLine + '\nThis session: ' + session.correct + '/' + session.rounds + ' correct · best streak ' +
        session.bestStreak + ' · ' + session.levelUps + ' level-up' + (session.levelUps === 1 ? '' : 's'),
      buttonText: 'Keep going',
      onGo: startRound,
    });
    return;
  }
  if (currentIsCapstone && !advanced) {
    toast.className = 'melodic-toast is-wrong';
    toast.textContent = 'Capstone missed — rebuild your streak';
  } else if (capstoneArmedNow) {
    toast.className = 'melodic-toast is-correct';
    toast.textContent = 'Capstone next — one clean melody to level up  +' + pts;
  } else if (tileProgress) {
    toast.className = 'melodic-toast is-correct';
    toast.textContent = 'Clean! ' + tileProgress.done + ' of ' + tileProgress.total + ' — ' + tileProgress.label + '  +' + pts;
  } else if (stageAdvanced) {
    toast.className = 'melodic-toast is-correct';
    const sIdx = (L.id === 'm1' ? (S.stages.m1 || 0) : (S.stages.m0 || 0)) + 1;
    toast.textContent = 'Stage ' + sIdx + ' of ' + (L.id === 'm1' ? 3 : 6) + '  +' + pts;
  } else if (coverageHint) {
    toast.className = 'melodic-toast is-correct';
    toast.textContent = coverageHint + '  +' + pts;
  } else if (result.correct) {
    toast.className = 'melodic-toast is-correct';
    toast.textContent = '+' + pts + (S.streak > 1 ? '  ·  ×' + S.streak : '');
  } else {
    toast.className = 'melodic-toast is-wrong';
    toast.textContent = (pts > 0 ? '+' + pts + ' · ' : '') + encourage();
    playTryAgain();
  }
  // AUTO-ADVANCE on EVERY level (owner: "we don't need a Next melody button — once correct
  // it can auto-advance"). Correct: a quick beat to enjoy the win. Wrong: a longer pause so
  // the student can read the correction before the next example. Level-ups already returned
  // above via their own overlay. (Daily/gym/studio have their own handlers + Next button.)
  document.getElementById('nextBtn').style.display = 'none';
  const advDelay = (result.correct && result.clean !== false) ? 1500 : 3400;
  setTimeout(() => { if (curLevel().id === L.id && !document.querySelector('.melodic-overlay')) newRound(); }, advDelay);
}

/* KIDS-MODE PARITY (kids-mode-design-principles memory + solo-mode's own rule):
   a young learner must never land in free-play with adult controls — under the
   kids theme the melodic game is GUIDED-ONLY: the free level picker and practice
   toggle hide, and Tock (the mascot — placeholder text presence until real art,
   per the plan's documented default) greets on intro cards. */
function kidsActive() {
  // The theme class lands when suite-theme.js initializes (AFTER this module) —
  // the first intro overlay renders before that, so also read the persisted choice.
  if (document.body.classList.contains('theme-kids')) return true;
  try { return localStorage.getItem('beatquest-theme') === 'kids'; } catch (e) { return false; }
}
function applyKidsChrome() {
  const kids = kidsActive();
  const lvlLabel = document.getElementById('levelJump') && document.getElementById('levelJump').closest('label');
  if (lvlLabel) lvlLabel.style.display = kids ? 'none' : '';
  const practiceLabel = document.getElementById('practiceChk') && document.getElementById('practiceChk').closest('label');
  if (practiceLabel) practiceLabel.style.display = kids ? 'none' : '';
}
new MutationObserver(applyKidsChrome).observe(document.body, { attributes: true, attributeFilter: ['class'] });
setTimeout(applyKidsChrome, 300); // after suite-theme applies the saved theme

document.getElementById('nextBtn').style.display = 'none'; // hidden until a round is graded
document.getElementById('nextBtn').onclick = newRound;

/* FREE LEVEL JUMP — mirrors RhythmQuest's level select: explore any rung without
   grinding the guided gate (owners/teachers preview; students can too — the
   guided mastery gate still governs ADVANCEMENT from wherever you are, and
   each level's mastery record is per-level, so jumping never corrupts progress. */
const levelJump = document.getElementById('levelJump');
const m0Index = PLAYABLE.findIndex((L) => L.id === 'm0');
const m1Index = PLAYABLE.findIndex((L) => L.id === 'm1');
// M0/M1 sub-stages are each jumpable so every step can be tested independently.
const M0_SUBS = [
  ['m0:0', 'Level 1 · Stage 1 Find home (live)'],
  ['m0:1', 'Level 1 · Stage 2 Find home (quick)'],
  ['m0:2', 'Level 1 · Stage 3 Tap home (tiles)'],
  ['m0:3', 'Level 1 · Stage 4 Tap 3̂'],
  ['m0:4', 'Level 1 · Stage 5 Tap 5̂'],
  ['m0:5', 'Level 1 · Stage 6 Home in any octave'],
];
const M1_SUBS = [
  ['m1:0', 'Level 2 · Stage 1 Up / down / same'],
  ['m1:1', 'Level 2 · Stage 2 Step or skip'],
  ['m1:2', 'Level 2 · Stage 3 Match the shape'],
];
PLAYABLE.forEach((L, i) => {
  const subs = L.id === 'm0' ? M0_SUBS : L.id === 'm1' ? M1_SUBS : null;
  if (subs) {
    subs.forEach(([val, label]) => {
      const o = document.createElement('option');
      o.value = val; o.textContent = label;
      levelJump.appendChild(o);
    });
    return;
  }
  const o = document.createElement('option');
  o.value = String(i);
  o.textContent = 'Level ' + (i + 1) + ' · ' + L.title;
  levelJump.appendChild(o);
});
function syncLevelJump() {
  levelJump.value = (S.levelIdx === m0Index) ? ('m0:' + (S.stages.m0 || 0))
    : (S.levelIdx === m1Index) ? ('m1:' + (S.stages.m1 || 0))
    : String(S.levelIdx);
}
levelJump.onchange = () => {
  const v = levelJump.value;
  if (v.slice(0, 3) === 'm0:') {
    const stage = Number(v.slice(3)) || 0;
    S.levelIdx = m0Index;
    S.stages.m0 = stage;
    S.m0StagePass = 0; // jumping into a tile stage starts its clean-round tally fresh
  } else if (v.slice(0, 3) === 'm1:') {
    const stage = Number(v.slice(3)) || 0;
    S.levelIdx = m1Index;
    S.stages.m1 = stage;
    S.m1StagePass = 0; S.m1FluentStreak = 0;
    if (stage < 2) S.m1ShapeDone = false; // re-testing an earlier stage clears shape mastery
  } else {
    S.levelIdx = Number(v);
  }
  S.streak = 0; // a jump is a new context — streaks don't carry across levels
  save(S);
  reviewingLevel = null;
  // the Studio's picks belong to the level they were chosen for
  studioSpec = null;
  { const pb = document.getElementById('practiceBtn'); if (pb) pb.textContent = 'Practice'; }
  newRound();
};
syncLevelJump();
// Placement is offered at new-student intake (the first-run onboarding), not as a
// gameplay button (owner). offerPlacement() stays available for a future profile
// "retest if you feel misplaced" entry point.

/* A single Gym station mounted in the round area — used by the spaced-review
   probe (spec §2) and the daily Gym challenge (spec §6). Distinct from the full
   board (gymMount). */
let gymStationMount = null;
let gymReviewCircuit = null; // circuit id while a Gym spaced-review is showing

function gymSideServices() {
  const kp = (curLevel().keys || [])[0] || { key: 'C', mode: 'major' };
  const labelCtx = { key: kp.key, mode: kp.mode, system: document.getElementById('sysSel').value, minorSolfege: 'la' };
  const services = createServices({ labelNoteFn: labelNote, labelPaletteFn: labelPalette, labelCtx, tempoBPM: 92 });
  lastServices = services;
  return { services, kp };
}
function clearForGymStation() {
  if (currentRenderer) { currentRenderer.destroy(); currentRenderer = null; }
  if (gymMount) { gymMount.destroy(); gymMount = null; }
  if (chunkMount) { chunkMount.destroy(); chunkMount = null; }
  if (gymStationMount) { gymStationMount.destroy(); gymStationMount = null; }
  document.querySelectorAll('.melodic-overlay').forEach((el) => el.remove());
  document.getElementById('dailyRow').style.display = '';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('toast').textContent = '';
}

// Spaced-review probe (spec §2): a due circuit surfaces as its NAME station.
function startGymReview(circuitId) {
  reviewingLevel = null;
  gymReviewCircuit = circuitId;
  clearForGymStation();
  const { services, kp } = gymSideServices();
  gymStationMount = mountGymStation(document.getElementById('rendererHost'), {
    circuitId, stationId: 'name', services, key: kp.key, mode: kp.mode,
    onResult(result) { onGymReviewResult(circuitId, result); },
  });
  renderHud();
}
function onGymReviewResult(circuitId, result) {
  const now = Date.now();
  S.review.entries = S.review.entries.map((e) =>
    e.skillId === 'gym:' + circuitId ? review.applyResult(e, !!result.correct, now) : e);
  if (result.correct) { S.reviewsPassed++; S.score += 50; S.xp += 1; checkAchievements(); }
  save(S);
  session.rounds++; if (result.correct) session.correct++;
  gymReviewCircuit = null;
  renderHud();
  const toastEl = document.getElementById('toast');
  toastEl.className = 'melodic-toast ' + (result.correct ? 'is-correct' : 'is-wrong');
  toastEl.textContent = result.correct
    ? 'Gym review passed — ' + circuitId + ' stays sharp'
    : 'Gym review lapse — ' + circuitId + ' comes around sooner';
  document.getElementById('nextBtn').style.display = '';
}

// Daily Gym challenge (spec §6): a date-seeded NAME station round.
function startDailyGym(ch) {
  clearForGymStation();
  const { services, kp } = gymSideServices();
  gymStationMount = mountGymStation(document.getElementById('rendererHost'), {
    circuitId: ch.circuitId, stationId: ch.stationId, seed: ch.seed,
    services, key: kp.key, mode: kp.mode, recordMastery: false, // a daily probe, like ladder dailies, doesn't move mastery
    onResult(result) {
      const i = ch.i; dailyActive = null;
      applyDailyResult(i, result);
    },
  });
  renderHud();
}

/* INTERVAL GYM (INTERVAL_GYM_SPEC §6): a side-mode, not a ladder rung — the
   button appears once the ladder reaches its first leap vocabulary (M7) and
   the whole circuit board is mounted in place of the round. Its progress lives
   in its own melodic-gym-v1 save; leaving the Gym resumes the ladder cleanly. */
let gymMount = null;
function closeGym() {
  if (gymMount) { gymMount.destroy(); gymMount = null; }
  document.getElementById('rendererHost').classList.remove('melodic-gym');
  newRound();
}
function openGym() {
  if (currentRenderer) { currentRenderer.destroy(); currentRenderer = null; }
  if (gymMount) { gymMount.destroy(); gymMount = null; }
  document.querySelectorAll('.melodic-overlay').forEach((el) => el.remove());
  document.getElementById('dailyRow').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('toast').textContent = '';
  // Gym items live in real key context (the research's whole point). Use the
  // student's current level's first diatonic key; symmetric collections can't
  // host degree pairs, so fall back to C major if a level has none.
  const kp = (curLevel().keys || [])[0] || { key: 'C', mode: 'major' };
  const labelCtx = { key: kp.key, mode: kp.mode, system: document.getElementById('sysSel').value, minorSolfege: 'la' };
  const services = createServices({ labelNoteFn: labelNote, labelPaletteFn: labelPalette, labelCtx, tempoBPM: 92 });
  lastServices = services;
  gymMount = mountGym(document.getElementById('rendererHost'), {
    mIndex: curLevel().mIndex,
    services,
    key: kp.key,
    mode: kp.mode,
    onStationStart() { document.getElementById('toast').textContent = ''; },
    onStationResult(circuitId, stationId, result) {
      const toastEl = document.getElementById('toast');
      toastEl.className = 'melodic-toast ' + (result.correct ? 'is-correct' : 'is-wrong');
      toastEl.textContent = result.correct
        ? 'Station passed — ' + Math.round(result.accuracy) + '%. Pick the next station or circuit.'
        : 'Not yet (' + Math.round(result.accuracy) + '%) — hear them again and retry the station.';
      // 'True Voice' achievement: a perfect MIC-graded SING round (not self-checked).
      if (result.meta && result.meta.station === 'sing' && result.clean && !result.meta.selfGraded && !S.gymSinger) {
        S.gymSinger = true; save(S);
        checkAchievements().forEach((a, i) => setTimeout(() => achievementBanner(a), i * 900));
      }
    },
    onCircuitComplete(circuitId, capstoneScore) {
      // MASTERY-EVENT economy (INTERVAL_GYM_SPEC §6: "+50 XP and gems per the
      // standard mastery-event formula") — the IDENTICAL formula the ladder uses,
      // fed by the capstone's accumulated score; a clean capstone earns the
      // clean-play bonus (cleanRate = 1). Volatile score gets the capstone points.
      S.gymCircuits = (S.gymCircuits || 0) + 1;
      S.xp += 50;
      const gemsEarned = masteryEventGems(capstoneScore, 1);
      S.gems += gemsEarned;
      S.score += (capstoneScore || 0);
      // SPACED REVIEW (spec §2): one entry per completed circuit, keyed 'gym:<id>',
      // first review a box-1 interval out (the same rule the ladder uses). A due
      // gym review surfaces in newRound() as that circuit's NAME station (§2).
      if (!S.review.entries.some((e) => e.skillId === 'gym:' + circuitId)) {
        S.review.entries.push({ ...review.createEntry('gym:' + circuitId, Date.now()), dueAt: Date.now() + review.BOX_INTERVALS_MS[1] });
      }
      const unlocked = checkAchievements();
      save(S); renderHud();
      playFanfare();
      const toastEl = document.getElementById('toast');
      toastEl.className = 'melodic-toast is-correct';
      toastEl.textContent = 'CIRCUIT COMPLETE! +50 XP · +' + gemsEarned + ' gems' +
        (unlocked.length ? ' · Achievement: ' + unlocked.map((a) => a.name).join(', ') : '');
      unlocked.forEach((a, i) => setTimeout(() => achievementBanner(a), 600 + i * 900));
    },
    onExit: closeGym,
  });
}
// Interval Gym opens from the Practice menu (openPracticeMenu).

/* BOOKEND drill (MELODIC_LADDER_EXPANSION_PLAN NEW-D): a side-mode teaching the
   anchor-the-ends-first strategy on the current level's own material. Own save;
   never touches the ladder's streak/capstone. */
let bookendMount = null;
function closeBookend() {
  if (bookendMount) { bookendMount.destroy(); bookendMount = null; }
  document.getElementById('rendererHost').classList.remove('melodic-bookend');
  newRound();
}
function openBookend() {
  if (currentRenderer) { currentRenderer.destroy(); currentRenderer = null; }
  if (gymMount) { gymMount.destroy(); gymMount = null; }
  if (chunkMount) { chunkMount.destroy(); chunkMount = null; }
  if (bookendMount) { bookendMount.destroy(); bookendMount = null; }
  document.querySelectorAll('.melodic-overlay').forEach((el) => el.remove());
  document.getElementById('dailyRow').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('toast').textContent = '';
  const L = curLevel();
  const choices = keyChoices(L);
  let rot = 0;
  const buildMelody = () => {
    const choice = choices[rot++ % choices.length];
    const seed = Math.floor(Math.random() * 1e6);
    // A real phrase (>=3 notes) so both ends AND a middle exist to fill.
    const round = buildRound(L, choice.value, seed, { lengthBars: Math.max(2, L.lengthBars || 2) });
    return round.melody;
  };
  const kp = (L.keys || [])[0] || { key: 'C', mode: 'major' };
  const labelCtx = { key: kp.key, mode: kp.mode, system: document.getElementById('sysSel').value, minorSolfege: 'la' };
  const services = createServices({ labelNoteFn: labelNote, labelPaletteFn: labelPalette, labelCtx, tempoBPM: 92 });
  lastServices = services;
  bookendMount = mountBookendDrill(document.getElementById('rendererHost'), {
    levelId: L.id, level: L, services, buildMelody, onExit: closeBookend,
  });
}
// Bookends opens from the Practice menu (openPracticeMenu).

/* PRACTICE STUDIO (§C3 D3): the extensive drill engine — the student picks the
   length (2, 4, or 8 measures), any key from the level's own key set, and any
   of its meters, then drills endless generated dictations. Studio rounds build
   mastery + coverage (they ARE the practice the coverage gate demands) but
   never arm or play a capstone — guided rounds own advancement. */
function leaveStudio() {
  studioSpec = null;
  { const pb = document.getElementById('practiceBtn'); if (pb) pb.textContent = 'Practice'; }
  newRound();
}
function openStudio() {
  if (studioSpec) { leaveStudio(); return; }
  const L = curLevel();
  document.querySelectorAll('.melodic-overlay').forEach((el) => el.remove());
  const ov = document.createElement('div');
  ov.className = 'melodic-overlay';
  const card = document.createElement('div');
  card.className = 'answer-area melodic-overlay__card';
  const h = document.createElement('div');
  h.className = 'melodic-overlay__heading';
  h.textContent = 'Practice studio — ' + levelLabel(L) + ' · ' + L.title;
  card.appendChild(h);
  const sub = document.createElement('div');
  sub.className = 'melodic-overlay__goal';
  sub.textContent = 'Endless dictation drills with this level’s own vocabulary. Pick your material — every correct round counts toward the level’s coverage, but only guided rounds level you up.';
  card.appendChild(sub);

  const mkSelect = (labelText, options) => {
    const label = document.createElement('label');
    label.style.cssText = 'display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0;';
    label.append(labelText);
    const sel = document.createElement('select');
    options.forEach(([v, t]) => {
      const o = document.createElement('option');
      o.value = v; o.textContent = t;
      sel.appendChild(o);
    });
    label.appendChild(sel);
    card.appendChild(label);
    return sel;
  };
  const lenSel = mkSelect('Length', [['2', '2 measures'], ['4', '4 measures'], ['8', '8 measures']]);
  const choices = keyChoices(L);
  const keySel = mkSelect('Key', choices.map((c, i) => [String(i), c.label]));
  const meterSet = L.meters || [L.meter];
  const meterSel = mkSelect('Meter', meterSet.map((m) => [m, m]));
  const modes = L.exerciseModes || [L.exerciseMode];
  const MODE_LABELS = {
    'tonic-contour': 'Listen & answer', 'rhythm-first': 'Rhythm dictation',
    labeling: 'Name the degrees', recognition: 'Pick the notation',
    'missing-note': 'Fill the hidden note', 'error-detect': 'Find the wrong note',
    'notation-entry': 'Full notation', 'two-part': 'Two-part',
  };
  const exSel = mkSelect('Exercise', modes.map((m) => [m, MODE_LABELS[m] || m]));

  const btnRow = document.createElement('div');
  btnRow.className = 'melodic-overlay__btnrow';
  const go = document.createElement('button');
  go.className = 'melodic-btn melodic-btn--primary';
  go.textContent = 'Start drilling';
  go.onclick = () => {
    studioSpec = {
      choice: choices[Number(keySel.value)],
      meter: meterSel.value,
      bars: Number(lenSel.value),
      exMode: exSel.value,
    };
    { const pb = document.getElementById('practiceBtn'); if (pb) pb.textContent = 'Leave studio'; }
    ov.remove();
    startRound();
  };
  const cancel = document.createElement('button');
  cancel.className = 'melodic-btn';
  cancel.textContent = 'Cancel';
  cancel.onclick = () => ov.remove();
  btnRow.append(go, cancel);
  card.appendChild(btnRow);
  ov.appendChild(card);
  document.body.appendChild(ov);
}
/* EAR ARCADE — a whack-a-degree GAME (Practice mode). Standalone; its own save-free session; never

// ---- ARCADE DRAWER: a sub-menu of the new playable game prototypes (Simon / Sky Hop / Note
// Invaders). Each is a standalone HTML file opened full-screen in an iframe so its own audio +

const ARCADE_GAMES = [
  { file: 'game-simon.html', name: 'Simon', blurb: 'Say the melody back — hear a growing tune by ear, tap the degrees in order.' },
  { file: 'game-runner.html', name: 'Contour Runner', blurb: 'Run the shape of the tune — hop to each pitch height; your path is the melody.' },
  { file: 'game-jump.html', name: 'Sky Hop', blurb: "Hop to the note's pitch height — high note, high ledge." },
  { file: 'game-invaders.html', name: 'Note Invaders', blurb: 'Shoot the invader whose degree matches the note you hear.' },
];
function openArcadeGame(file) {
  const ov = document.createElement('div'); ov.className = 'melodic-arcade-frame';
  ov.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#04040c;display:flex;flex-direction:column;';
  const bar = document.createElement('div');
  bar.style.cssText = 'flex:0 0 auto;display:flex;justify-content:flex-end;padding:8px 10px;background:#04040c;';

function openArcadeDrawer() {
  document.querySelectorAll('.melodic-overlay').forEach((el) => el.remove());

  const sub = document.createElement('div'); sub.className = 'melodic-overlay__goal';

// ---- PRACTICE MENU: ONE neutral "Practice" button opens a menu of the practice modes, each gated
// by level and labelled with a one-line "when to use". Consolidates what used to be 5 look-alike
// buttons (owner: "4 buttons that seem to do the same thing"). Modes still open their existing UIs.
function practiceModes() {
  return [
    { name: 'Arcade', blurb: 'Playable game prototypes — Simon, Sky Hop, Note Invaders.', gate: 0, open: openArcadeDrawer },
    { name: 'Ear Arcade', blurb: 'Fast game — tap the scale degree you hear. (In progress)', gate: 0, open: openEarArcade },
    { name: 'Practice studio', blurb: 'Endless drills of this level — you pick length, key & meter.', gate: 0, open: openStudio },
    { name: 'Pattern drill', blurb: 'Learn recurring melodic shapes (chunks) as one unit.', gate: melodicLevel('m3').mIndex, open: openChunkDrill },
    { name: 'Bookends', blurb: 'Anchor the first & last notes, then fill the middle.', gate: melodicLevel('m4').mIndex, open: openBookend },
    { name: 'Skills Gym', blurb: 'Drill one isolated skill at a time.', gate: 0, open: openSkillsGym },
    { name: 'Interval Gym', blurb: 'Focused interval-hearing circuits.', gate: melodicLevel('m7').mIndex, open: openGym },
  ];
}
function openPracticeMenu() {
  document.querySelectorAll('.melodic-overlay').forEach((el) => el.remove());
  const ov = document.createElement('div'); ov.className = 'melodic-overlay';
  const card = document.createElement('div'); card.className = 'answer-area melodic-overlay__card';
  const h = document.createElement('div'); h.className = 'melodic-overlay__heading'; h.textContent = 'Practice'; card.appendChild(h);
  const sub = document.createElement('div'); sub.className = 'melodic-overlay__goal';
  sub.textContent = 'Extra ways to train. These build mastery and coverage, but only guided rounds level you up.';

    const bl = document.createElement('div'); bl.className = 'melodic-practice-item__blurb'; bl.textContent = m.blurb;

// While a studio session is live the button LEAVES it (its label reads "Leave studio"); otherwise it
// opens the menu.
document.getElementById('practiceBtn').onclick = () => { if (studioSpec) leaveStudio(); else openPracticeMenu(); };
// "About this level" is now a small info icon beside the title (owner) — click it
// only if you're unsure what the level is about.
(function wireAboutIcon() {
  const el = document.getElementById('aboutIcon');
  if (!el) return;
  el.appendChild(gameIcon('info', 18));
  el.onclick = () => { showLevelIntro(reviewingLevel || curLevel(), 'Back to the round', () => {}); };
})();
document.getElementById('sysSel').onchange = newRound;
const practiceChk = document.getElementById('practiceChk');
practiceChk.checked = !!S.practice;
practiceChk.onchange = () => { S.practice = practiceChk.checked; save(S); newRound(); };

// RETURN DECAY (mastery-progression-model, LOCKED): coming back after time away, step
// the working level back to the highest rung whose DECAYED mastery is still at least
// Familiar — so a LONG layoff (several faded skills) lands you where you're actually
// still solid, not one rung down from rust. Records are untouched; never a reset.
(function returnDecayStepBack() {
  let stepped = 0;
  while (S.levelIdx > 0) {
    const item = S.items[curLevel().id];
    if (!item || !Array.isArray(item.recent) || !item.recent.length) break; // no history here — stop
    const v = mastery.viewItemAsOf(item, Date.now());
    if (v.score < 50) { S.levelIdx--; stepped++; } else break; // faded below Familiar -> back up
  }
  if (stepped > 0) {
    S.capstoneArmed = false;
    S.streak = 0;
    save(S);
    setTimeout(() => {
      const toastEl = document.getElementById('toast');
      toastEl.className = 'melodic-toast';
      toastEl.textContent = 'Welcome back — warming up ' + (stepped === 1 ? 'one level' : stepped + ' levels') +
        ' down (' + curLevel().id.toUpperCase() + '). Your progress is safe.';
    }, 400);
  }
})();

// Test seam — ONLY with ?mqtest=1: drive rounds/grading deterministically.
if (MQ_TEST) {
  window.__mqTest = { S, PLAYABLE, newRound, curLevel, mastery, review, save, openGym, closeGym,
    openStudio, leaveStudio, coverageComplete, covFor, openChunkDrill, closeChunk,
    startGymReview, startDailyGym, dailyChallenges, renderDaily, openBookend, closeBookend,
    openSkillsGym, closeSkillsGym,
    setStudio(spec) { studioSpec = spec; }, getRoundInfo() { return currentRoundInfo; },
    setInstrument: (name) => lastServices && lastServices.setInstrument(name),
    currentInstrument: () => (lastServices ? lastServices.currentInstrument() : 'synth') };
}

// Safari policy-muted audio: the services watchdog fires this ONCE when sound was
// scheduled into a running context but the measured output stayed at zero.
window.addEventListener('melodic-audio-silent', () => {
  const toastEl = document.getElementById('toast');
  toastEl.className = 'melodic-toast is-wrong';
  toastEl.textContent = 'Your browser is blocking this page\u2019s sound. In Safari: Safari menu \u2192 Settings for This Website \u2192 Auto-Play \u2192 "Allow All Auto-Play", then reload.';
});

/* FIRST-RUN ONBOARDING (impress + de-risk before a cold student's first minute):
   a warm welcome -> a real AUDIO CHECK (the historical #1 failure is silent audio;
   catch it here and route to the fix instead of leaving the student staring at a
   mute page) -> a plain "how it works" -> hand off to placement or the first rung.
   Shown once (S.onboarded), and only for a brand-new device. */
function firstRunOnboarding(done) {
  const labelCtx = { key: 'C', mode: 'major', system: document.getElementById('sysSel').value, minorSolfege: 'la' };
  const svc = createServices({ labelNoteFn: labelNote, labelPaletteFn: labelPalette, labelCtx, tempoBPM: 92 });
  lastServices = svc;

  const ov = document.createElement('div');
  ov.className = 'melodic-overlay';
  const card = document.createElement('div');
  card.className = 'answer-area melodic-overlay__card';
  ov.appendChild(card);
  document.body.appendChild(ov);
  const finish = () => { S.onboarded = true; save(S); if (ov.parentNode) ov.remove(); done(); };

  function screenWelcome() {
    card.innerHTML = '';
    const h = document.createElement('div'); h.className = 'melodic-overlay__heading'; h.textContent = 'Welcome to MelodyQuest';
    const s = document.createElement('div'); s.className = 'melodic-overlay__sub';
    s.textContent = 'Learn to hear music and write it down — from your very first note to full melodies.';
    const g = document.createElement('div'); g.className = 'melodic-overlay__goal';
    g.textContent = 'It only takes a minute to get set up. First, let’s make sure your sound is working.';
    const row = document.createElement('div'); row.className = 'melodic-overlay__btnrow';
    const go = document.createElement('button'); go.className = 'melodic-btn melodic-btn--primary'; go.textContent = 'Start';
    go.onclick = screenAudio;
    row.append(go);
    card.append(h, s, g, row);
  }

  function screenAudio() {
    card.innerHTML = '';
    const h = document.createElement('div'); h.className = 'melodic-overlay__heading'; h.textContent = 'Can you hear this?';
    const s = document.createElement('div'); s.className = 'melodic-overlay__sub'; s.textContent = 'Tap the button — you should hear a clear note. Turn your volume up first.';
    const row = document.createElement('div'); row.className = 'melodic-overlay__btnrow';
    const playBtn = document.createElement('button'); playBtn.className = 'melodic-btn melodic-btn--play'; // transport -> green
    playBtn.append(svc.icon('play'), document.createTextNode(' Play a note'));
    let played = false;
    playBtn.onclick = async () => { await svc.playNote(60, 1.2); setTimeout(() => svc.playNote(64, 1.2), 700); played = true; ansRow.style.display = ''; };
    row.append(playBtn);
    const ansRow = document.createElement('div'); ansRow.className = 'melodic-overlay__btnrow'; ansRow.style.display = 'none';
    const yes = document.createElement('button'); yes.className = 'melodic-btn'; yes.append(svc.icon('check'), document.createTextNode(' I heard it'));
    yes.onclick = screenHow;
    const no = document.createElement('button'); no.className = 'melodic-btn'; no.textContent = 'I heard nothing';
    no.onclick = screenNoSound;
    ansRow.append(yes, no);
    card.append(h, s, row, ansRow);
  }

  function screenNoSound() {
    card.innerHTML = '';
    const h = document.createElement('div'); h.className = 'melodic-overlay__heading'; h.textContent = 'Let’s fix the sound';
    const ul = document.createElement('ul'); ul.className = 'melodic-overlay__listen';
    [
      'Check your device volume isn’t muted, and unplug/replug headphones if you use them.',
      'On Safari: Safari menu > Settings for This Website > Auto-Play > “Allow All Auto-Play”, then reload.',
      'Some browsers need one tap on the page before audio starts — tap Play again.',
    ].forEach((t) => { const li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
    const row = document.createElement('div'); row.className = 'melodic-overlay__btnrow';
    const retry = document.createElement('button'); retry.className = 'melodic-btn melodic-btn--primary'; retry.textContent = 'Try the sound again';
    retry.onclick = screenAudio;
    const skip = document.createElement('button'); skip.className = 'melodic-btn'; skip.textContent = 'Continue anyway';
    skip.onclick = screenHow;
    row.append(retry, skip);
    card.append(h, ul, row);
  }

  function screenHow() {
    card.innerHTML = '';
    const h = document.createElement('div'); h.className = 'melodic-overlay__heading'; h.textContent = 'How it works';
    const s = document.createElement('div'); s.className = 'melodic-overlay__sub'; s.textContent = 'Melodic dictation = hearing music and writing it down. We build it up one skill at a time:';
    const ul = document.createElement('ul'); ul.className = 'melodic-overlay__listen';
    [
      'First you find “home” — the note everything settles to.',
      'Then the rhythm — how long each note lasts.',
      'Then the scale-degrees or solfège — which notes they are.',
      'Finally, writing a melody on the staff — rhythm first, then the notes.',
    ].forEach((t) => { const li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
    const tip = document.createElement('div'); tip.className = 'melodic-overlay__strategy'; tip.textContent = 'You’ll never do it all at once — each level adds just one new thing.';
    const nudge = document.createElement('div'); nudge.className = 'melodic-overlay__stats';
    nudge.textContent = 'Anytime: switch the look (top-right) or choose Numbers vs. Do-Re-Mi at the bottom.';
    const row = document.createElement('div'); row.className = 'melodic-overlay__btnrow';
    // A 20-second demo: hear a real short melody (with the warm voice) before starting.
    const demoBtn = document.createElement('button'); demoBtn.className = 'melodic-btn melodic-btn--play'; demoBtn.append(svc.icon('play'), document.createTextNode(' Hear an example')); // transport -> green
    demoBtn.onclick = async () => {
      demoBtn.disabled = true;
      const phrase = [60, 64, 67, 64, 62, 60]; // do-mi-sol-mi-re-do, an easy tonal shape
      for (let i = 0; i < phrase.length; i++) setTimeout(() => svc.playNote(phrase[i], 0.6), i * 560);
      setTimeout(() => { demoBtn.disabled = false; }, phrase.length * 560 + 300);
    };
    const go = document.createElement('button'); go.className = 'melodic-btn melodic-btn--primary'; go.textContent = 'Choose where to start';
    go.onclick = screenStart;
    row.append(demoBtn, go);
    card.append(h, s, ul, tip, nudge, row);
  }

  function screenStart() {
    card.innerHTML = '';
    const h = document.createElement('div'); h.className = 'melodic-overlay__heading'; h.textContent = 'Where should you start?';
    const row = document.createElement('div'); row.className = 'melodic-overlay__btnrow';
    const beginner = document.createElement('button'); beginner.className = 'melodic-btn melodic-btn--primary'; beginner.textContent = 'New to this — start at the beginning';
    beginner.onclick = () => { finish(); }; // done() -> newRound() opens M0's own intro
    const placed = document.createElement('button'); placed.className = 'melodic-btn'; placed.textContent = 'Done ear training before — place me';
    placed.onclick = () => { S.onboarded = true; save(S); if (ov.parentNode) ov.remove(); offerPlacement(); };
    row.append(beginner, placed);
    card.append(h, row);
  }

  screenWelcome();
}

rollDailyDate();
renderDaily();
if (!S.onboarded && S.levelIdx === 0 && !Object.keys(S.items).length) {
  firstRunOnboarding(() => { newRound(); });
} else if (!S.placed && S.levelIdx === 0 && !Object.keys(S.items).length) {
  S.placed = true; // legacy path for devices onboarded before this flow existed
  offerPlacement();
} else {
  newRound();
}
</script>

<script>
  /* Theme dropdown (in the controls) drives the shared theme engine; the old floating
     chip bar is hidden. Reflects the saved choice and applies changes live. */
  (function () {
    var sel = document.getElementById('themeSel');
    if (!sel) return;
    try { sel.value = localStorage.getItem('beatquest-theme') || 'mpc'; } catch (e) {}
    sel.addEventListener('change', function () {
      if (window.BeatQuestTheme) window.BeatQuestTheme.apply(sel.value);
    });
  })();

  /* Settings drawer: cog opens it, scrim / close button / Esc dismiss it. */
  (function () {
    var cog = document.getElementById('cogBtn');
    var drawer = document.getElementById('settingsDrawer');
    var scrim = document.getElementById('settingsScrim');
    var closeBtn = document.getElementById('settingsClose');
    if (!cog || !drawer || !scrim) return;
    function open() { scrim.hidden = false; drawer.hidden = false; }
    function close() { scrim.hidden = true; drawer.hidden = true; }
    cog.addEventListener('click', open);
    scrim.addEventListener('click', close);
    if (closeBtn) closeBtn.addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !drawer.hidden) close(); });
  })();
</script>
