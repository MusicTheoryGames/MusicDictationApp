<!-- RhythmQuest's answer-board styling (measure groups, white fill/complete panel, span, circle
     numbers), ported verbatim in answer-board.css. Scoped to .answer-board, so it only affects
     MelodyQuest's new rhythm-entry board. -->
<link rel="stylesheet" href="shared/rhythm-notation/answer-board.css?v=20260712-mqboard">
<style>
  /* Structural layout only — COLORS come from the suite theme (body.theme-*)
     via the shared panel classes below, per the no-universal-colors rule. */
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; }
  .header { padding: 16px 24px 4px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .header h1 { font-size: 1.35rem; margin: 0; margin-right: auto; }
  .melodic-hud { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
    max-width: 1000px; margin: 6px auto 0; padding: 0 24px; width: 100%; }
  .melodic-hud__title { display: inline-flex; align-items: center; gap: 9px; }
  /* Two-line title: small "Level N" over the big title (+ info icon). Never breaks mid-word. */
  .melodic-hud__level { display: flex; flex-direction: column; line-height: 1.08; }
  .melodic-hud__levelnum { font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
  .melodic-hud__leveltitle { font-weight: 900; font-size: 1.7rem; letter-spacing: .015em; display: inline-flex; align-items: center; gap: 8px; }
  .melodic-hud__about { background: transparent; border: none; padding: 3px; margin: 0; cursor: pointer;
    opacity: .45; color: inherit; line-height: 0; border-radius: 50%; transition: opacity .12s ease; }
  .melodic-hud__about:hover, .melodic-hud__about:focus-visible { opacity: 1; }
  .melodic-hud__goal { opacity: .8; flex-basis: 100%; margin-top: -2px; }
  .melodic-hud__mastery { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .melodic-hud__game { flex-basis: 100%; font-weight: 700; opacity: .9; }
  /* Round stars: big, immediate, visual verdict (SVG, currentColor — no emoji). */
  .melodic-stars { display: flex; gap: 6px; margin: 8px 0 2px; height: 34px; }
  .melodic-stars svg { width: 32px; height: 32px; opacity: .25; transform: scale(.6); }
  .melodic-stars svg.is-earned { opacity: 1; color: #f5b301; animation: starPop .45s cubic-bezier(.2,1.6,.4,1) forwards; }
  .melodic-stars svg.is-earned:nth-child(2) { animation-delay: .12s; }
  .melodic-stars svg.is-earned:nth-child(3) { animation-delay: .24s; }
  @keyframes starPop { from { transform: scale(.4) rotate(-18deg); } to { transform: scale(1) rotate(0); } }
  /* Floating +points */
  /* Correct-answer celebration: custom-SVG confetti spray + a central star pop. */
  .melodic-confetti { position: absolute; inset: 0; overflow: visible; pointer-events: none; z-index: 40; }
  .melodic-confetti span { position: absolute; left: 50%; top: 44%; display: block; will-change: transform, opacity; }
  .melodic-confetti span svg { display: block; width: 100%; height: 100%; }
  @keyframes confettiFly {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.2) rotate(0deg); }
    12%  { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--rot)); }
  }
  .melodic-celebrate-pop { position: absolute; left: 50%; top: 42%; color: #f5b301; z-index: 41; pointer-events: none;
    transform: translate(-50%, -50%); animation: celebratePop .9s cubic-bezier(.2,1.5,.4,1) forwards; }
  @keyframes celebratePop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-25deg); }
    30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.12) rotate(0deg); }
    72%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3) rotate(10deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .melodic-confetti, .melodic-celebrate-pop { display: none; }
  }
  .melodic-scorepop { position: absolute; font-weight: 900; font-size: 2rem; color: #2a9d5c;
    pointer-events: none; animation: scoreRise 1.2s ease-out forwards; z-index: 50; text-shadow: 0 2px 6px rgba(0,0,0,.25); }
  @keyframes scoreRise { 0% { opacity: 0; transform: translateY(8px) scale(.7); } 18% { opacity: 1; transform: translateY(0) scale(1.15); } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-40px) scale(1); } }
  /* Achievement banner */
  .melodic-achv { position: fixed; top: 18px; left: 50%; transform: translateX(-50%) translateY(-80px);
    z-index: 950; padding: 12px 22px; border-radius: 12px; font-weight: 800; display: flex; gap: 10px;
    align-items: center; background: #1f2430; color: #ffd23f; box-shadow: 0 8px 30px rgba(0,0,0,.35);
    animation: achvIn .5s cubic-bezier(.2,1.4,.4,1) forwards, achvOut .5s ease-in 3.4s forwards; }
  .melodic-achv svg { width: 22px; height: 22px; }
  @keyframes achvIn { to { transform: translateX(-50%) translateY(0); } }
  @keyframes achvOut { to { transform: translateX(-50%) translateY(-80px); opacity: 0; } }
  .melodic-hud__bar { width: 140px; height: 12px; border-radius: 6px; overflow: hidden; background: rgba(127,127,127,.25); }
  .melodic-hud__fill { height: 100%; width: 0; transition: width .3s; background: currentColor; }
  .melodic-main { max-width: 1000px; margin: 0 auto; padding: 14px 24px 60px; }
  .answer-area { border-radius: 16px; padding: 26px 28px; position: relative; }
  /* Theme is a set-once preference, not an every-screen control — hide the floating
     picker suite-theme.js appends to <body>; it now lives inside the Settings drawer. */
  #themeSwitcher { display: none !important; }
  /* Settings cog + slide-in drawer: keep config off the gameplay screen entirely. */
  .melodic-cog { position: fixed; top: 12px; right: 12px; z-index: 1200; width: 40px; height: 40px;
    display: inline-flex; align-items: center; justify-content: center; border-radius: 999px;
    border: none; cursor: pointer; color: currentColor; background: rgba(127,127,127,.16); opacity: .7; }
  .melodic-cog:hover { opacity: 1; }
  .melodic-drawer-scrim { position: fixed; inset: 0; z-index: 1300; background: rgba(0,0,0,.5); }
  .melodic-drawer { position: fixed; top: 0; right: 0; z-index: 1301; height: 100%; width: min(340px, 88vw);
    display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,.35);
    background: #17171a; color: #e8e8ea; /* default; each theme overrides in suite-theme.css */
    transform: translateX(0); transition: transform .18s ease; }
  .melodic-drawer[hidden] { display: flex !important; transform: translateX(102%); pointer-events: none; }
  .melodic-drawer-scrim[hidden] { display: none; }
  .melodic-drawer__head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid rgba(127,127,127,.25); }
  .melodic-drawer__title { font-size: 1.1rem; font-weight: 800; letter-spacing: .02em; }
  .melodic-drawer__close { padding: 6px; min-width: 0; }
  .melodic-drawer__body { display: flex; flex-direction: column; gap: 18px; padding: 20px 18px; overflow-y: auto; }
  .melodic-drawer__body label { display: flex; flex-direction: column; gap: 6px; font-size: .92rem; font-weight: 700; }
  .melodic-drawer__body label.melodic-drawer__check { flex-direction: row; align-items: center; gap: 8px; font-weight: 600; }
  .melodic-drawer__body select { padding: 9px 10px; border-radius: 8px; font-size: 1rem; }
  .melodic-controls { display: flex; gap: 12px; margin-top: 20px; align-items: center; flex-wrap: wrap; }
  .melodic-controls select { padding: 6px 10px; border-radius: 8px; font-size: .9rem; }
  .melodic-toast { font-weight: 800; min-height: 1.4em; margin-top: 10px; }

  /* Renderer structural styles (same semantic class names the renderers emit
     everywhere — lab and game share the renderer code verbatim). */
  .melodic-btn { padding: 11px 20px; border-radius: 10px; border: 2px solid transparent; font-weight: 700; cursor: pointer; font-size: 1rem; display: inline-flex; align-items: center; gap: 8px; }
  .melodic-btn svg { width: 15px; height: 15px; }
  /* icon-only button (e.g. Play on tile stages, Hear-home reference): compact square, no word */
  .melodic-btn--icon { padding: 11px 14px; gap: 0; }
  .melodic-btn--icon svg { width: 20px; height: 20px; }
  /* Play button is ALWAYS just the green triangle; the hearings pips sit in their own row
     BELOW it (this wrapper stacks them), so the button never changes shape. */
  /* Every renderer's "[Play] HOME" row: the buttons are DOM-appended with no whitespace, so
     without this they touch/collide. Center them with a gap; wrap on narrow phones. */
  [class$="__play-row"] { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .melodic-play-wrap { display: inline-flex; flex-direction: row; align-items: center; gap: 14px; }
  .melodic-play-wrap__col { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; }
  .melodic-hearpips { display: inline-flex; gap: 5px; align-items: center; }
  .melodic-hearpip { width: 7px; height: 7px; border-radius: 999px; background: currentColor; opacity: .85; }
  .melodic-hearpip.is-spent { opacity: .22; }
  /* Transport buttons (--play / --go) are GREEN, but each THEME renders that green in its
     own style — see the per-theme rules in suite-theme.css. The role (green=play, accent=CTA)
     is consistent WITHIN every theme; the exact shade/finish differs BETWEEN themes. */
  /* degree/choice palettes: consistent keycap-sized buttons */
  .melodic-labeling__palette .melodic-btn, .melodic-missing-note__palette .melodic-btn,
  .melodic-notation-entry__palette .melodic-btn, .melodic-error-detect__palette .melodic-btn { min-width: 58px; justify-content: center; font-size: 1.15rem; }
  .melodic-recognition__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  @media (max-width: 760px) { .melodic-recognition__grid { grid-template-columns: 1fr; } }
  .melodic-recognition__option { border: 2px solid rgba(127,127,127,.35); border-radius: 12px; padding: 12px; cursor: pointer; background: #fff; }
  /* Option staves must be READABLE at a glance — the four choices differ by one
     or two noteheads, so small engraving makes them look identical (self-run
     finding while watching the real flow). */
  /* Staff scales to fit the tile (renderStaff is responsive now) — whole melody + clef always show. */
  .melodic-recognition__option.is-correct { border-color: #2a9d5c; }
  .melodic-recognition__option.is-wrong { border-color: #e6413a; }
  .melodic-recognition__status, .melodic-labeling__status, .melodic-missing-note__status,
  .melodic-error-detect__status, .melodic-notation-entry__status, .melodic-tonic-contour__status { font-weight: 800; min-height: 1.4em; margin-top: 8px; }
  .is-correct { color: #2a9d5c; }
  .is-wrong { color: #e6413a; }
  .melodic-labeling__strip, .melodic-missing-note__strip, .melodic-notation-entry__strip { display: flex; gap: 6px; margin: 10px 0; }
  .melodic-labeling__slot, .melodic-missing-note__slot, .melodic-notation-entry__slot { min-width: 54px; height: 46px; border: 2px solid rgba(127,127,127,.4); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; background: #fff; }
  .melodic-labeling__slot.is-active, .melodic-missing-note__slot.is-active { border-color: #3b82f6; }
  .melodic-labeling__slot.is-filled, .melodic-missing-note__slot.is-filled, .melodic-notation-entry__slot.is-filled { background: #eef3fc; }
  .melodic-labeling__palette, .melodic-missing-note__palette, .melodic-notation-entry__palette { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .melodic-labeling__palette .melodic-btn, .melodic-missing-note__palette .melodic-btn,
  .melodic-notation-entry__palette .melodic-btn { background: #fff; color: #1f2430; border-color: rgba(127,127,127,.4); }
  .melodic-btn:disabled { opacity: .4; cursor: default; }
  .melodic-notation-entry__actions { display: flex; gap: 8px; margin: 10px 0; }
  .melodic-notation-entry__heading, .melodic-tonic-contour__prompt { font-weight: 700; margin-bottom: 8px; }
  .melodic-notation-entry__progress { opacity: .7; font-size: .85rem; margin-bottom: 8px; }
  /* wrap + center so rows (degree palettes, choices, play rows) never spill past the
     themed container/plating — items must fit inside it, not run off screen. */
  .melodic-tonic-contour__choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 10px 0; }
  .melodic-tonic-contour__card { margin: 10px 0; }
  .melodic-tonic-contour__progress { opacity: .7; font-size: .85rem; }
  .melodic-tonic-contour__heading { font-weight: 800; font-size: 1.1rem; margin-bottom: 6px; }
  /* Interval Gym (INTERVAL_GYM_SPEC §6) */
  .melodic-gym__heading { font-size: 1.15rem; }
  .melodic-gym__board { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin: 12px 0 16px; }
  .melodic-gym__circuit { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left; padding: 12px 14px; }
  .melodic-gym__circuit span { font-size: .8rem; opacity: .75; font-weight: 500; }
  .melodic-gym__circuit.is-locked { opacity: .45; }
  .melodic-gym__chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 14px; }
  .melodic-gym__chip { font-size: .85rem; padding: 6px 10px; }
  .melodic-gym__chip[disabled] { opacity: .4; }
  .melodic-btn.is-selected { outline: 2px solid currentColor; }
  .melodic-gym__capstone { display: block; margin: 4px 0 12px; }
  .melodic-gym__capstone-done { margin: 4px 0 12px; }
  .melodic-hud__coverage { font-size: .85rem; opacity: .8; }
  .melodic-feedback { margin-top: 8px; font-size: .92rem; font-weight: 600; opacity: .92; line-height: 1.45; max-width: 620px; }
  .melodic-bookend .melodic-labeling__staff { margin: 12px 0; }
  /* Prominent target: "Click every (play) 3-hat you hear" — a soft note-coin pill (the little
     round play button says "tap to hear it"), sized so the degree is the hero without the
     boxed-number-in-a-sentence look. Surrounding words are quiet so the coin leads. */
  .melodic-tap-target { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 9px;
    margin: 6px 0 12px; font-size: 1rem; font-weight: 600; }
  .melodic-tap-target__lead { opacity: .62; letter-spacing: .01em; }
  .melodic-tap-target__chip { display: inline-flex; align-items: center; gap: 13px; cursor: pointer;
    padding: 5px 20px 5px 7px; border-radius: 999px; color: inherit;
    border: 1.5px solid rgba(128,128,128,.38); background: rgba(128,128,128,.12);
    transition: transform .08s ease, background .12s ease, border-color .12s ease; }
  .melodic-tap-target__play { display: inline-flex; align-items: center; justify-content: center;
    width: 27px; height: 27px; border-radius: 999px; flex: 0 0 auto;
    border: 1.5px solid currentColor; background: rgba(128,128,128,.10); }
  .melodic-tap-target__play svg { width: 11px; height: 11px; margin-left: 1px; opacity: .95; }
  /* Degree is the hero. The extra top padding leaves room for the caret (hat) so it
     never crowds the play button or looks vertically off. */
  .melodic-tap-target__deg { font-weight: 900; font-size: 1.5rem; line-height: 1; letter-spacing: .02em; padding-top: 2px; }
  .melodic-tap-target__chip:hover { background: rgba(128,128,128,.22); border-color: currentColor; }
  .melodic-tap-target__chip:active { transform: translateY(1px); }
  /* M0 stage 0 — live "find home" single big button + its feedback states. */
  .melodic-live-home { text-align: center; }
  .melodic-live-home__progress { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 6px 0 16px; }
  .melodic-live-home__hits { display: inline-flex; gap: 8px; }
  .melodic-live-home__hit { width: 14px; height: 14px; border-radius: 999px; border: 2px solid currentColor; opacity: .4; transition: all .15s ease; }
  .melodic-live-home__hit.is-filled { background: #2a9d5c; border-color: #2a9d5c; opacity: 1; }
  .melodic-live-home__keys { display: inline-flex; gap: 5px; }
  .melodic-live-home__key { width: 8px; height: 8px; border-radius: 999px; border: 1px solid currentColor; opacity: .35; }
  .melodic-live-home__key.is-done { background: currentColor; opacity: .8; }
  .melodic-live-home__key.is-active { opacity: 1; box-shadow: 0 0 0 3px rgba(230,184,0,.35); border-color: #e6b800; background: #e6b800; }
  /* Tile-stage round meter: a dot per required clean round (owner: not a jammed text line). */
  .melodic-round-meter { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 2px 0 10px; }
  .melodic-round-meter__dot { width: 12px; height: 12px; border-radius: 999px; border: 2px solid currentColor; opacity: .4; }
  .melodic-round-meter__dot.is-done { background: #2a9d5c; border-color: #2a9d5c; opacity: 1; }
  .melodic-round-meter__fast { font-weight: 800; color: #e6b800; font-size: .85rem; letter-spacing: .03em; margin-left: 6px; text-transform: uppercase; }
  /* Big HOME button: wears the theme accent (via melodic-btn--primary) so it looks like
     THE thing to tap, not a grey box. Size/shape here; colour comes from the theme. */
  .melodic-live-home__btn { font-weight: 900; font-size: 1.4rem; letter-spacing: .08em; padding: 20px 0;
    width: min(280px, 78%); border-radius: 16px; cursor: pointer;
    display: inline-flex; justify-content: center; align-items: center; /* centre the label (base .melodic-btn left-aligns) */
    box-shadow: 0 4px 0 rgba(0,0,0,.28);
    transition: transform .06s ease, background .1s ease, border-color .1s ease, box-shadow .12s ease; }
  .melodic-live-home__btn:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(0,0,0,.25); }
  /* "tap me" pulse + glow while waiting to begin. */
  .melodic-live-home__btn.is-await { animation: liveHomeInvite 1.5s ease-in-out infinite; }
  @keyframes liveHomeInvite { 0%,100% { transform: scale(1); box-shadow: 0 4px 0 rgba(0,0,0,.28); }
    50% { transform: scale(1.045); box-shadow: 0 8px 26px rgba(0,0,0,.35); } }
  /* Feedback flashes must beat the theme accent (higher specificity), hence !important. */
  .melodic-live-home__btn.is-demo { border-color: #e6b800 !important; box-shadow: 0 6px 20px rgba(230,184,0,.5) !important; animation: liveHomePulse 1.4s ease-in-out infinite; }
  .melodic-live-home__btn.is-hit { border-color: #2a9d5c !important; background: #2a9d5c !important; color: #fff !important; box-shadow: 0 6px 20px rgba(42,157,92,.55) !important; transform: translateY(-3px); }
  .melodic-live-home__btn.is-false { border-color: #e6413a !important; background: #e6413a !important; color: #fff !important; }
  .melodic-live-home__btn.is-miss { border-color: #d08700 !important; background: #d08700 !important; color: #fff !important; }
  @keyframes liveHomePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  .melodic-live-home__restart { margin-top: 16px; padding: 9px; border-radius: 999px; opacity: .6; min-width: 0; }
  .melodic-live-home__restart svg { width: 22px; height: 22px; display: block; }
  .melodic-live-home__restart:hover { opacity: 1; }
  /* M1 contour controls: SVG arrow buttons (stage 0), step/skip move grid (stage 1),
     shape-picker (stage 2). All custom SVG, feedback via the shared is-correct/is-wrong. */
  .melodic-contour-btn { min-width: 84px; height: 64px; display: inline-flex; align-items: center; justify-content: center; }
  .melodic-contour-btn svg { width: 50px; height: 44px; }
  .melodic-move-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 300px; margin: 12px auto; }
  .melodic-move-btn { height: 66px; border-radius: 12px; border: 2px solid rgba(128,128,128,.4); background: rgba(128,128,128,.10);
    cursor: pointer; color: inherit; display: inline-flex; align-items: center; justify-content: center; transition: transform .08s ease, background .1s ease, border-color .1s ease; }
  .melodic-move-btn svg { width: 44px; height: 40px; }
  .melodic-move-btn:hover { background: rgba(128,128,128,.2); border-color: currentColor; }
  .melodic-move-btn:active { transform: translateY(1px); }
  .melodic-move-btn--same { grid-column: 1 / span 2; height: 52px; }
  .melodic-move-btn.is-correct { border-color: #2a9d5c; color: #2a9d5c; box-shadow: inset 0 0 0 3px #2a9d5c; }
  .melodic-move-btn.is-wrong { border-color: #e6413a; color: #e6413a; box-shadow: inset 0 0 0 3px #e6413a; }
  .melodic-shape-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
  .melodic-shape-btn { padding: 10px 14px; border-radius: 14px; border: 2px solid rgba(128,128,128,.4); background: rgba(128,128,128,.10);
    cursor: pointer; color: inherit; transition: transform .08s ease, background .1s ease, border-color .1s ease; }
  .melodic-shape-btn svg { width: 132px; height: 66px; display: block; }
  .melodic-shape-btn:hover { background: rgba(128,128,128,.2); border-color: currentColor; }
  .melodic-shape-btn:active { transform: translateY(1px); }
  .melodic-shape-btn.is-correct { border-color: #2a9d5c; color: #2a9d5c; box-shadow: 0 0 0 3px rgba(42,157,92,.4); }
  .melodic-shape-btn.is-wrong { border-color: #e6413a; color: #e6413a; }
  /* Tap-stream tiles + beat cursor (M0 stages 2-4 · Gym FIND) */
  .melodic-tap-tiles { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
  .melodic-tap-tile { min-width: 48px; height: 54px; border-radius: 10px; border: 2px solid rgba(128,128,128,.45);
    background: transparent; font-weight: 800; font-size: 1.05rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: transform .08s ease, box-shadow .08s ease, border-color .1s ease; }
  .melodic-tap-tile.is-marked { border-color: currentColor; box-shadow: inset 0 0 0 3px currentColor; }
  .melodic-tap-tile.is-playing { transform: translateY(-6px); border-color: #e6b800; box-shadow: 0 6px 16px rgba(230,184,0,.45); }
  /* Three DISTINCT grading states so a false mark and a missed target never look alike:
     correct (green, check) · wrong = you marked it but it wasn't the note (red, cross) ·
     missed = it WAS the note but you didn't mark it (amber dashed, dot). */
  .melodic-tap-tile.is-correct { border-color: #2a9d5c; color: #2a9d5c; box-shadow: inset 0 0 0 3px #2a9d5c; }
  .melodic-tap-tile.is-wrong { border-color: #e6413a; color: #e6413a; box-shadow: inset 0 0 0 3px #e6413a; }
  .melodic-tap-tile.is-missed { border-color: #d08700; color: #a86a00; border-style: dashed; box-shadow: inset 0 0 0 2px rgba(208,135,0,.4); }
  .melodic-tap-tile__mark { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .melodic-tap-tile__mark svg { width: 13px; height: 13px; }
  .melodic-tap-tile.is-correct .melodic-tap-tile__mark { color: #2a9d5c; }
  .melodic-tap-tile.is-wrong .melodic-tap-tile__mark { color: #e6413a; }
  .melodic-tap-tile.is-missed .melodic-tap-tile__mark { color: #d08700; }
  .melodic-tap-tile { position: relative; }
  .melodic-tap-tile--wide { min-width: 120px; padding: 0 14px; font-size: .95rem; }
  /* HOME is an ACTION button (replay home anytime), not an answer tile — give it a
     filled, obviously-clickable look distinct from the empty numbered tiles. */
  .melodic-tap-tile--home { min-width: 82px; gap: 5px; font-size: .8rem; letter-spacing: .04em; margin-right: 12px;
    background: rgba(128,128,128,.22); border-color: currentColor; opacity: 1;
    box-shadow: 0 2px 0 rgba(0,0,0,.28); }
  .melodic-tap-tile--home svg { width: 15px; height: 15px; }
  .melodic-tap-tile--home:hover { background: rgba(128,128,128,.34); }
  .melodic-tap-tile--home:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(0,0,0,.28); }
  /* Motivation bar (visible points · streak · journey · next goal) */
  .melodic-motivation { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 4px 0 14px; padding: 10px 14px; border-radius: 12px; background: rgba(128,128,128,.10); }
  .melodic-motivation__streak { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: .95rem; padding: 5px 12px; border-radius: 999px; border: 1px solid rgba(128,128,128,.35); }
  .melodic-motivation__streak.is-hot { border-color: #e6b800; color: #e6b800; box-shadow: 0 0 0 2px rgba(230,184,0,.18) inset; }
  .melodic-motivation__streak.is-hot.bump { animation: mot-bump .4s ease; }
  @keyframes mot-bump { 0%{transform:scale(1)} 40%{transform:scale(1.18)} 100%{transform:scale(1)} }
  .melodic-motivation__journey { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .melodic-motivation__step { font-size: .82rem; font-weight: 700; padding: 3px 9px; border-radius: 8px; opacity: .5; border: 1px solid transparent; }
  .melodic-motivation__step.is-active { opacity: 1; border-color: currentColor; }
  .melodic-motivation__step.is-done { opacity: .95; color: #2a9d5c; }
  /* Journey as dots: upcoming = hollow dot, done = filled+check, current = labelled pill. */
  /* stage progress: uniform pure dots — colour is the only signal, no words */
  .melodic-motivation__pip { display: inline-block; width: 11px; height: 11px; border-radius: 999px; box-sizing: border-box; }
  .melodic-motivation__pip.is-upcoming { border: 2px solid currentColor; opacity: .3; }        /* not yet: empty ring */
  .melodic-motivation__pip.is-done { background: #2a9d5c; }                                     /* passed: solid green */
  .melodic-motivation__pip.is-active { background: #e6b800; box-shadow: 0 0 0 3px rgba(230,184,0,.3); } /* you-are-here: solid amber */
  /* Level 4 two-step meter (Rhythm -> Notes): dots, not "Step 1/Step 2" words */
  .melodic-rhythm-steps { display: flex; justify-content: center; gap: 8px; margin: 8px 0 12px; min-height: 11px; }
  /* Native figure-tile rhythm entry (ported RhythmQuest bank; white surfaces so the note glyphs read on every theme) */
  .melodic-rhythmentry__staff { display: flex; justify-content: center; min-height: 92px; overflow-x: auto; margin: 4px 0 10px; background: #fff; border-radius: 10px; padding: 6px; }
  .melodic-rhythmentry__empty { opacity: .65; font-size: .9rem; padding: 28px 6px; text-align: center; color: #333; }
  .melodic-rhythmentry__beats { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 2px 0 12px; }
  .melodic-rhythmentry__beat { width: 9px; height: 9px; border-radius: 999px; border: 2px solid currentColor; opacity: .3; box-sizing: border-box; }
  .melodic-rhythmentry__beat.is-filled { background: #2a9d5c; border-color: #2a9d5c; opacity: 1; }
  .melodic-rhythmentry__bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 6px 0; }
  .melodic-rhythmentry__tile { background: #fff; border: 1px solid rgba(0,0,0,.18); border-radius: 8px; padding: 4px 8px; min-height: 58px; display: inline-flex; align-items: center; cursor: pointer; }
  .melodic-rhythmentry__tile:hover:not(:disabled) { border-color: #2a9d5c; box-shadow: 0 0 0 2px rgba(42,157,92,.3); }
  .melodic-rhythmentry__tile:disabled { opacity: .32; cursor: default; }
  .melodic-motivation__sep { opacity: .35; }
  .melodic-motivation__score { margin-left: auto; font-weight: 800; font-size: 1rem; }
  .melodic-motivation__goal { flex-basis: 100%; font-size: .85rem; font-weight: 600; opacity: .85; }
  .melodic-sing__meter { height: 10px; border-radius: 6px; background: rgba(128,128,128,.25); margin: 10px 0; overflow: hidden; max-width: 320px; }
  .melodic-sing__meter span { display: block; height: 100%; width: 0%; background: #2a9d5c; transition: width .05s linear; }
  .melodic-memory-span__slots { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; margin: 14px 0; border-radius: 12px; padding: 6px; }
  /* HOME block sits with the answer boxes (Level 1 style); lights when home is sounding */
  .melodic-memory-span__home { display: inline-flex; align-items: center; gap: 5px; height: 40px; padding: 0 12px; border-radius: 8px;
    border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit; font-weight: 800; letter-spacing: .04em; cursor: pointer; }
  .melodic-memory-span__home svg { width: 14px; height: 14px; }
  .melodic-memory-span__home.is-playing { border-color: #e6b800; box-shadow: 0 0 0 3px rgba(230,184,0,.35); color: #e6b800; }
  /* whole-row "listening" glow while the tune plays — NOT a per-box cursor */
  .melodic-memory-span__slots.is-listening { animation: memListen 1.1s ease-in-out infinite; }
  @keyframes memListen { 0%,100% { box-shadow: 0 0 0 0 rgba(230,184,0,0); } 50% { box-shadow: 0 0 0 4px rgba(230,184,0,.18); } }
  .melodic-memory-span__slot { min-width: 34px; height: 40px; line-height: 40px; text-align: center; border-radius: 8px; border: 1px solid rgba(128,128,128,.4); font-weight: 800; font-size: 1.1rem; }
  .melodic-memory-span__slot.is-filled { border-style: solid; }
  .melodic-memory-span__slot.is-correct { border-color: #2a9d5c; color: #2a9d5c; }
  .melodic-memory-span__slot.is-wrong { border-color: #e6413a; color: #e6413a; }
  .melodic-protonotation__grid { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
  .melodic-protonotation__col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .melodic-protonotation__contour { display: flex; gap: 3px; min-height: 30px; align-items: center; font-weight: 800; }
  .melodic-protonotation__arrow { padding: 3px 7px; font-size: 1rem; }
  .melodic-protonotation__degree { padding: 6px; border-radius: 8px; font-size: 1rem; font-weight: 700; }
  .melodic-tap-target__tap { width: 100%; max-width: 420px; padding: 26px 0; font-size: 1.5rem; margin: 14px 0; }
  .melodic-tap-target__reveal { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .melodic-tap-target__chip { min-width: 40px; text-align: center; padding: 6px 8px; border-radius: 8px; border: 2px solid rgba(127,127,127,.4); font-weight: 800; background: #fff; color: #1f2430; }
  .melodic-tap-target__chip.is-correct { border-color: #2a9d5c; }
  .melodic-tap-target__chip.is-wrong { border-color: #e6413a; }
  .melodic-error-detect__hint { opacity: .8; margin: 8px 0; }
  .melodic-error-detect__staff, .melodic-missing-note__staff, .melodic-labeling__staff { overflow-x: auto; }

  /* (removed a stray universal "--play/--primary = flat blue" fallback — transport green and
     the CTA accent are both fully owned per-theme in suite-theme.css now.) */

  /* Level-intro / level-up overlay: a dim scrim + one themed panel (the card
     reuses .answer-area so every theme's panel treatment applies untouched). */
  .melodic-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex;
    align-items: center; justify-content: center; z-index: 900; }
  .melodic-overlay__card { max-width: 460px; width: calc(100% - 40px); padding: 26px 28px;
    display: flex; flex-direction: column; gap: 12px; text-align: center; align-items: center; }
  .melodic-overlay__heading { font-size: 1.5rem; font-weight: 800; }
  .melodic-overlay__sub { font-size: 1.05rem; font-weight: 700; }
  .melodic-overlay__goal { opacity: .85; }
  .melodic-overlay__stats { font-size: .9rem; opacity: .75; }
  .melodic-overlay__listen-label { font-weight: 700; margin-top: 2px; }
  .melodic-overlay__listen { text-align: left; margin: 0; padding-left: 22px; }
  .melodic-overlay__listen li { margin: 3px 0; }
  .melodic-overlay__strategy { font-style: italic; opacity: .85; }
  .melodic-overlay__controls { margin: 8px 0; padding: 10px 13px; border-radius: 10px; background: rgba(128,128,128,.13); line-height: 1.45; }
  .melodic-overlay__controls-lbl { font-weight: 800; }
  /* Skills Gym */
  .melodic-skillsgym__level { font-size: 1.1rem; padding: 16px 20px; width: min(360px, 88%); display: block; margin: 10px auto; }
  .melodic-skillsgym__bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 12px; border-radius: 12px;
    background: rgba(128,128,128,.12); margin-bottom: 12px; font-weight: 800; }
  .melodic-skillsgym__skill { flex: 1 1 auto; }
  .melodic-skillsgym__streak, .melodic-skillsgym__score { opacity: .85; font-size: .95rem; }
  .melodic-skillsgym__end { margin-left: auto; }
  .melodic-skillsgym__drill { padding: 4px 0; }
  .melodic-skillsgym__summary { text-align: center; }
  .melodic-skillsgym__summary .melodic-btn { margin: 6px; }
  .melodic-skillsgym__free { display: block; margin: 14px auto 8px; opacity: .9; }
  .melodic-skillsgym__freegrid { flex-wrap: wrap; justify-content: center; }
  .melodic-skillsgym__reward { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); z-index: 60;
    padding: 12px 20px; border-radius: 12px; font-weight: 900; box-shadow: 0 6px 24px rgba(0,0,0,.4);
    background: rgba(128,128,128,.2); border: 2px solid currentColor; animation: scoreRise 2.4s ease forwards; }
  .melodic-skillsgym__reward.is-big { color: #f5b301; font-size: 1.2rem; }
  .melodic-skillsgym__reward.is-medium { color: #2a9d5c; }
  .melodic-skillsgym__reward.is-small { color: inherit; opacity: .8; font-size: .85rem; animation-duration: 1.1s; }
  /* M1 modal legend — move icons + meanings + play example */
  .melodic-legend { margin: 10px 0 4px; border-radius: 12px; padding: 10px 12px; background: rgba(128,128,128,.10); }
  .melodic-legend__note { font-size: .9rem; opacity: .85; margin-bottom: 8px; line-height: 1.4; }
  .melodic-legend__row { display: flex; align-items: center; gap: 12px; padding: 5px 0; }
  .melodic-legend__icon { display: inline-flex; width: 46px; flex: 0 0 auto; }
  .melodic-legend__icon svg { width: 46px; height: 40px; }
  .melodic-legend__label { flex: 1 1 auto; font-weight: 700; text-align: left; }
  .melodic-legend__play { padding: 5px 12px; font-size: .85rem; }
  .melodic-legend__play svg { margin-right: 4px; }
  .melodic-overlay__btnrow { display: flex; gap: 10px; margin-top: 6px; }
  .melodic-placement__card { max-width: 520px; }
  .melodic-placement__tier { width: 100%; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; text-align: left; }
  .melodic-placement__tier span { font-weight: 400; opacity: .8; font-size: .9rem; }
  .melodic-daily { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .melodic-daily__label { font-weight: 700; opacity: .85; }
  .melodic-daily__chip.is-done { opacity: .55; }
  .melodic-howto, .melodic-tonic-contour__howto { opacity: .85; margin: 4px 0 12px; line-height: 1.45; }
  /* suite-theme's mountDecor injects a DECORATIVE fake score/VU HUD into .header
     (built for the rhythm game's chrome). This page shows REAL mastery — fake
     score data next to it is misleading clutter. */
  .header .dq-extra { display: none !important; }
  /* Single-line rhythm staff (labeling / notation-entry phase 2): notation ink
     stays black-on-card; the ACTIVE note (awaiting its degree) highlights via
     the .is-active class renderRhythmLine sets on the note's SVG group. */
  .melodic-labeling__staff, .melodic-notation-entry__rhythm { background: #fff; border-radius: 12px;
    padding: 14px 16px 8px; overflow-x: auto; margin: 14px 0; display: flex; justify-content: center; }
  /* Pitched staffs sit on a white card in EVERY theme — engraving must always
     read as ink on paper (same principle as the recognition option cards). */
  .melodic-error-detect__staff, .melodic-missing-note__staff { display: flex; justify-content: center;
    background: #fff; border-radius: 12px; padding: 12px 16px; margin: 12px 0; overflow-x: auto; }
  .melodic-labeling__staff svg .is-labelable:hover path,
  .melodic-notation-entry__rhythm svg .is-labelable:hover path { fill: #3b82f6; stroke: #3b82f6; }
  .melodic-labeling__staff svg .is-active path,
  .melodic-notation-entry__rhythm svg .is-active path { fill: #3b82f6; stroke: #3b82f6; }
  .melodic-rhythmline { margin: 0 auto; }
  .melodic-rhythmline__label { font-weight: 800; font-size: 1.05rem; color: #1f2430; min-width: 20px; text-align: center; }
  .melodic-rhythmline__label:not(.is-filled) { opacity: .35; }
  .melodic-rhythmline__label.is-active { color: #3b82f6; }
  /* Mystery-note chip (missing-note): an empty-slot marker at the note's true
     position — deliberately NOT a notehead, so it carries zero pitch information. */
  .melodic-mystery-chip { display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border: 2px dashed #6b7280; border-radius: 7px;
    background: #fff; color: #1f2430; font-weight: 800; font-size: 15px; }

  /* Per-example playback SPEED WHEEL (in every dictation level's play row). A compact vertical
     scroll picker showing ONE mode at a time; flick/scroll to change, click cycles. currentColor
     border + inset edge-shadow hint that it scrolls; the bright option is the active mode. Never
     green (green stays the Play CTA). Starts on Medium each example. */
  .melodic-speedwheel { display: inline-flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: ns-resize; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .melodic-speedwheel:focus-visible { outline: none; }
  .melodic-speedwheel__cap { font-size: .58rem; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; opacity: .5; }
  .melodic-speedwheel__view { height: 30px; width: 86px; overflow-y: auto; scroll-snap-type: y mandatory;
    border: 1.5px solid currentColor; border-radius: 9px; scrollbar-width: none; -ms-overflow-style: none;
    box-shadow: inset 0 7px 6px -7px currentColor, inset 0 -7px 6px -7px currentColor; }
  .melodic-speedwheel__view::-webkit-scrollbar { display: none; }
  .melodic-speedwheel__track { display: flex; flex-direction: column; }
  .melodic-speedwheel__opt { height: 30px; line-height: 30px; scroll-snap-align: center; text-align: center;
    font-size: .82rem; font-weight: 800; opacity: .32; transition: opacity .12s; }
  .melodic-speedwheel__opt.is-active { opacity: 1; }

  /* Measure-focus aid (Level 4): "Hear a bar" 1 / 2 — plays a single bar at the wheel speed and
     highlights it on the staff. Numbered play buttons; the highlight is a blue "listen" tint,
     distinct from green (which means placed / correct). */
  .melodic-measurehear { display: flex; align-items: center; justify-content: center; gap: 8px;
    flex-wrap: wrap; margin: 2px 0 4px; }
  .melodic-measurehear__cap { font-size: .72rem; font-weight: 800; opacity: .6; }
  .melodic-measurehear__btn { padding: 4px 12px 4px 9px; min-width: 42px; font-size: .85rem;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
  .melodic-measurehear__btn svg { width: 13px; height: 13px; }
  .mq-rhythm-native .beat-drop-zone.mq-hear { background: rgba(52,152,219,0.22);
    box-shadow: inset 0 0 0 2px rgba(52,152,219,0.55); border-radius: 4px; }

  /* Practice menu — one stacked button per mode (name + one-line "when to use"). */
  .melodic-practice-item { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 14px; }
  .melodic-practice-item__name { font-weight: 800; }
  .melodic-practice-item__blurb { font-size: .8rem; opacity: .72; margin-top: 2px; font-weight: 500; }

  /* Ear Arcade (Practice mode) — whack-a-degree game. Neutral per-theme (currentColor); hit = green
     flash, wrong tap = red flash (game feedback, matching the reserved grading colours). */
  .melodic-arcade { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
  .melodic-arcade__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .melodic-arcade__title { font-weight: 800; font-size: 1rem; }
  .melodic-arcade__pips { display: flex; gap: 5px; }
  .melodic-arcade__pip { width: 9px; height: 9px; border-radius: 999px; border: 1.5px solid currentColor; opacity: .4; }
  .melodic-arcade__pip.is-active { opacity: 1; background: currentColor; }
  .melodic-arcade__pip.is-done { opacity: .8; background: currentColor; }
  .melodic-arcade__scorerow { display: flex; align-items: baseline; justify-content: space-between; }
  .melodic-arcade__score { font-weight: 900; font-size: 1.3rem; }
  .melodic-arcade__combo { font-weight: 800; opacity: .8; }
  .melodic-arcade__combo.is-hot { color: #f5b301; }
  .melodic-arcade__stage { position: relative; min-height: 96px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; border-radius: 14px; background: rgba(127,127,127,.10); padding: 14px; }
  .melodic-arcade__pulse { width: 46px; height: 46px; border-radius: 999px; background: currentColor; opacity: .18; transform: scale(.7); }
  .melodic-arcade__pulse.is-on { animation: mq-arcade-pop .32s ease-out; }
  @keyframes mq-arcade-pop { 0% { transform: scale(1.25); opacity: .85; } 100% { transform: scale(.7); opacity: .18; } }
  .melodic-arcade__status { font-size: .9rem; opacity: .85; text-align: center; }
  .melodic-arcade__pad { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .melodic-arcade__key { min-width: 64px; min-height: 56px; font-size: 1.2rem; font-weight: 800; }
  .melodic-arcade__key.is-hit { background: #2a9d5c !important; color: #fff !important; border-color: #2a9d5c !important; }
  .melodic-arcade__key.is-false { background: #e6413a !important; color: #fff !important; border-color: #e6413a !important; }
  .melodic-arcade__actions { display: flex; gap: 10px; justify-content: center; }

  /* ============================================================================
     RHYTHM STAGE (Level 4) — MelodyQuest's rhythm-dictation layout host. `.mq-rhythm-native` wraps the
     answer board (MqRhythmBoard / mq-rhythm-board.js, styled by the shared answer-board.css so the LOOK
     matches RhythmQuest) + the PNG tile bank. RhythmStudent (rhythm-student.js) is loaded ONLY for its
     pattern bank + grading lookups, NOT for this board. The rules below are the MelodyQuest layout
     (wrapper, bank panel, green screen, tile pads); the board internals come from answer-board.css.
     ============================================================================ */
  .mq-rhythm-native { display: flex; flex-direction: column; gap: 12px; width: 100%; align-items: stretch; }
  .mq-rhythm-native .answer-area { order: 1; }
  .mq-rhythm-native .rhythm-bank { order: 2; }

  .mq-rhythm-native .rhythm-bank { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
    border-radius: 15px; padding: 12px; border: 1px solid rgba(255,255,255,0.18); flex-shrink: 0; }
  .mq-rhythm-native .rhythm-tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    max-height: 30vh; overflow-y: auto; }
  .mq-rhythm-native .rhythm-tile { width: 120px; flex: 0 0 120px; background: rgba(255,255,255,0.08);
    backdrop-filter: blur(16px) saturate(180%); border-radius: 18px; padding: 0; cursor: grab;
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1); border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.6); text-align: center;
    color: #333; font-size: 0.8rem; min-height: 78px; display: flex; flex-direction: column;
    justify-content: center; align-items: center; position: relative; overflow: hidden; }
  .mq-rhythm-native .rhythm-tile::before { content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); }
  .mq-rhythm-native .rhythm-tile img { max-width: 100%; height: auto; padding: 0 !important; margin: 0 !important; }
  .mq-rhythm-native .rhythm-tile:hover { border-color: rgba(255,255,255,0.4); }
  .mq-rhythm-native .rhythm-tile.dragging { opacity: 0.5; cursor: grabbing; }

  /* ── The rhythm ANSWER board is MelodyQuest's OWN interactive board (mq-rhythm-board.js), styled by
     the shared answer-board.css (RhythmQuest's board styling: measure groups, white fill/complete panel,

<script>
/* Rotate-gate driver (same orientation mechanism as tapping.html). Two independent flags on <body>:
   - app-portrait: innerHeight>innerWidth (more reliable than the orientation media feature, esp. in
     emulators / iPad split-view).
   - mq-rhythm-stage: whether the Level-4 rhythm-dictation UI (.mq-rhythm-native) is currently mounted.
   The gate (#rotateGate) shows only when BOTH are set, so portrait is blocked ONLY on the rhythm
   screen; MelodyQuest's other stages stay usable in portrait. Driven from this always-fresh HTML (not
   the module JS) so a stale cached module can't leave the gate un-wired. */
(function () {
  function updateOrientation() {
    document.body.classList.toggle('app-portrait', window.innerHeight > window.innerWidth);
  }
  window.addEventListener('resize', updateOrientation);
  window.addEventListener('orientationchange', updateOrientation);
  updateOrientation();

  var rafPending = false;
  function syncRhythmStage() {
    rafPending = false;
    document.body.classList.toggle('mq-rhythm-stage', !!document.querySelector('.mq-rhythm-native'));
  }
  function scheduleSync() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(syncRhythmStage);
  }
  // The rhythm stage mounts/unmounts as levels change; watch the DOM and re-check on each mutation
  // (coalesced to one check per frame so tile-drag churn stays cheap).
  if (typeof MutationObserver !== 'undefined') {
    new MutationObserver(scheduleSync).observe(document.body, { childList: true, subtree: true });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', syncRhythmStage);
  } else {
    syncRhythmStage();
  }
})();
</script>

const MIN_LEVEL_ROUNDS = 10;
const MAX_KEYS_REQUIRED = 6;
function covFor(id) {
  const c = S.coverage[id] = S.coverage[id] || { keys: {}, meters: {}, rounds: 0, longClean: false };

function coverageNeeds(L) {
  // m19 (modulating) and m24's symmetric rounds mount recognition regardless of
  // the doc's later modes (audit §A5) — need only what can actually mount; for
  // m24 the pentatonic keys DO mount labeling/notation, so all three stand.
  return {
    keysNeeded: Math.min(keyChoices(L).length, MAX_KEYS_REQUIRED),
    metersNeeded: L.meters || [L.meter],

function coverageComplete(L) {
  const cov = S.coverage[L.id];

    && metersNeeded.every((m) => cov.meters[m])
