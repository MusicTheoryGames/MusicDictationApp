<h1>Melodic generator — before / after</h1>
<p class="sub">Left = v1 (random-but-valid). Right = v2 (harmony-first + motif). Both pass the classical validators; the difference is whether it sounds like a <em>tune</em>. Tap ▶ to hear. In v2 4-bar examples, <b>bar 3 restates bar 1</b> (a parallel period).</p>

const VF = Vex.Flow;
const DUR = { 'w':4,'h':2,'q':1,'8':0.5,'16':0.25,'hd':3,'qd':1.5 };
function measures(mel){ return Object.keys(mel).filter(k=>k.startsWith('measure')).sort().map(k=>mel[k]); }
function vexToTone(k){ const [l,o]=k.split('/'); return l.toUpperCase()+o; }

function render(host, mel){
  host.innerHTML='';
  const ms = measures(mel);
  const per = 150, W = 40 + ms.length*per;
  const r = new VF.Renderer(host, VF.Renderer.Backends.SVG); r.resize(W,140);
  const ctx = r.getContext();
  let x=10;
  ms.forEach((m,i)=>{
    const st = new VF.Stave(x, 10, i===0?per+30:per);
    if(i===0){ st.addClef('treble'); st.addTimeSignature(mel.timeSignature); }
    if(i===ms.length-1) st.setEndBarType(VF.Barline.type.END);
    st.setContext(ctx).draw();
    const notes = m.map(n=>new VF.StaveNote({keys:n.keys,duration:n.duration,auto_stem:true}));
    const beams = VF.Beam.generateBeams(notes,{groups:VF.Beam.getDefaultBeamGroups(mel.timeSignature)});
    const v = new VF.Voice({num_beats:parseInt(mel.timeSignature),beat_value:parseInt(mel.timeSignature.split('/')[1])}).setStrict(false).addTickables(notes);
    new VF.Formatter().joinVoices([v]).formatToStave([v],st);
    v.draw(ctx,st); beams.forEach(b=>b.setContext(ctx).draw());
    x += (i===0?per+30:per);
  });
}

let synth;
async function play(mel, btn){
  await Tone.start();
  if(!synth) synth = new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:.01,decay:.1,sustain:.3,release:.2}}).toDestination();
  const bpm=96, spb=60/bpm;
  let t=Tone.now()+0.05;
  measures(mel).forEach(m=>m.forEach(n=>{
    const beats=DUR[n.duration]||1, dur=beats*spb;
    synth.triggerAttackRelease(vexToTone(n.keys[0]), Math.max(.12,dur*.92), t);
    t+=dur;
  }));
  btn.textContent='▶ playing…'; setTimeout(()=>btn.textContent=btn.dataset.lbl,(t-Tone.now())*1000+200);
}

const app=document.getElementById('app');
DATA.forEach(c=>{
  const el=document.createElement('div'); el.className='case';
  el.innerHTML='<h2>'+c.label+'</h2><div class="row"></div>';
  const row=el.querySelector('.row');
  [['v1','t1','p1','v1 · random-valid'],['v2','t2','p2','v2 · harmony + motif']].forEach(([key,tc,pc,name])=>{
    const ver=document.createElement('div'); ver.className='ver';
    ver.innerHTML='<span class="tag '+tc+'">'+name+'</span><div class="staff"></div>';
    const btn=document.createElement('button'); btn.className=(key==='v2'?'p2':''); btn.textContent='▶ play'; btn.dataset.lbl='▶ play';
    btn.onclick=()=>play(c[key],btn); ver.appendChild(btn);
    row.appendChild(ver);
    render(ver.querySelector('.staff'), c[key]);
  });
  app.appendChild(el);
});
