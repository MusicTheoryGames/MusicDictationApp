<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Groove Meter — Mockups</title>
<style>
  :root{ --ink:#333a52; --muted:#8a90a8; --line:#e8ecf8; --accent:#5b6ee1; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif; color:var(--ink); }
  body{ background:linear-gradient(160deg,#eef4ff,#f6eef7,#ffeef4); display:flex; flex-direction:column; }
  .bar{ flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:10px 14px; background:rgba(255,255,255,.72); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .bar b{ font-size:14px; }
  .tab{ border:1.5px solid var(--line); background:#fff; color:var(--ink); font-weight:800; font-size:12px; padding:8px 13px; border-radius:10px; cursor:pointer; font-family:inherit; }
  .tab.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .bar label{ font-size:13px; font-weight:800; display:flex; align-items:center; gap:8px; }
  input[type=range]{ width:180px; accent-color:var(--accent); }
  #drain{ font-family:inherit; font-weight:800; font-size:12px; border:none; background:linear-gradient(135deg,#34d17f,#22b083); color:#fff; padding:8px 14px; border-radius:10px; cursor:pointer; }
  .stage{ flex:1 1 auto; display:flex; align-items:center; justify-content:center; padding:20px; min-height:0; }

  .frame{ position:relative; width:100%; max-width:760px; aspect-ratio:16/9; background:#fff; border-radius:18px; box-shadow:0 8px 30px rgba(70,90,140,.16); }
  /* Option B keeps a light grey border on 3 sides + a right-edge bar track */
  .frame.optB{ border:5px solid #e2e8f6; border-right-color:transparent; }
  .frame.optA{ border:none; }

  /* OPTION A — full-border SVG ring (grey track + colour fill that drains symmetrically) */
  .ring{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; display:none; }
  .frame.optA .ring{ display:block; }
  .ring .track{ fill:none; stroke:#e2e8f6; stroke-width:6; }
  .ring .gr{ fill:none; stroke-width:6; stroke-linecap:round; transition:stroke .25s; }

  /* OPTION B — right-side vertical bar (track + fill that drains) */
  .rightbar{ position:absolute; top:8px; right:-5px; bottom:8px; width:6px; border-radius:6px; background:#e2e8f6; display:none; }
  .frame.optB .rightbar{ display:block; }
  .rightbar .rb-fill{ position:absolute; left:0; right:0; bottom:0; border-radius:6px; background:#22b083; transition:height .25s, background .25s; }

  .tsig{ position:absolute; left:26px; top:20px; font-weight:900; font-size:26px; line-height:.9; color:var(--accent); }
  .tsig span{ display:block; }
  .tiles{ position:absolute; left:78px; top:16px; display:flex; gap:6px; }
  .tile{ width:74px; height:56px; border:2px dashed #b9c6ee; border-radius:12px; background:#fbfcff; }
  .barline{ width:3px; background:#333a52; border-radius:2px; margin:0 5px; }
  .badge{ position:absolute; right:14px; bottom:-13px; display:flex; align-items:center; gap:6px; font-size:.72rem; font-weight:800; letter-spacing:.04em; background:#fff; padding:3px 11px; border-radius:10px; border:1px solid var(--line); box-shadow:0 1px 6px rgba(90,110,170,.14); }
  .badge svg{ width:16px; height:16px; fill:none; stroke-width:1.6; }
  .lvl{ position:absolute; left:14px; top:-15px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:3px 11px; font-size:12px; font-weight:800; box-shadow:0 1px 6px rgba(90,110,170,.12); }
  .hint{ position:absolute; bottom:-40px; left:50%; transform:translateX(-50%); font-size:12px; color:var(--muted); white-space:nowrap; }
</style>
</head>
<body>
  <div class="bar">
    <b>Groove meter</b>
    <button class="tab on" data-opt="A">A · Full border ring</button>
    <button class="tab" data-opt="B">B · Right-side bar</button>
    <label>Groove <input type="range" id="slider" min="0" max="100" value="100"><span id="val">100%</span></label>
    <button id="drain">▶ Watch it drain</button>
  </div>
  <div class="stage">
    <div class="frame optA" id="frame">
      <svg class="ring" id="ring"><path class="track"></path><path class="gr grR"></path><path class="gr grL"></path></svg>
      <div class="rightbar"><i class="rb-fill" id="rbfill"></i></div>
      <div class="lvl">LEVEL 1</div>
      <div class="tsig"><span>2</span><span>4</span></div>
      <div class="tiles"><i class="tile"></i><i class="tile"></i><i class="barline"></i><i class="tile"></i><i class="tile"></i></div>
      <div class="badge" id="badge"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.6"/><circle cx="10" cy="10" r="2"/></svg><span id="badgeTxt">GROOVE 100%</span></div>
      <div class="hint">Drag the slider or hit “Watch it drain.”</div>
    </div>
  </div>

<script>
  var frame=document.getElementById('frame'), ring=document.getElementById('ring'),
      rbfill=document.getElementById('rbfill'), slider=document.getElementById('slider'),
      val=document.getElementById('val'), badgeTxt=document.getElementById('badgeTxt'), badge=document.getElementById('badge');
  function grooveCol(g){ return 'hsl('+Math.round(g*1.3)+',68%,44%)'; }
  function drawRing(g){
    var W=frame.clientWidth, H=frame.clientHeight, S=6, R=18, t=S/2, cx=W/2;
    ring.setAttribute('viewBox','0 0 '+W+' '+H);
    var track='M'+(t+R)+' '+t+'L'+(W-t-R)+' '+t+'A'+R+' '+R+' 0 0 1 '+(W-t)+' '+(t+R)+'L'+(W-t)+' '+(H-t-R)+'A'+R+' '+R+' 0 0 1 '+(W-t-R)+' '+(H-t)+'L'+(t+R)+' '+(H-t)+'A'+R+' '+R+' 0 0 1 '+t+' '+(H-t-R)+'L'+t+' '+(t+R)+'A'+R+' '+R+' 0 0 1 '+(t+R)+' '+t+'Z';
    var rp='M'+cx+' '+t+'L'+(W-t-R)+' '+t+'A'+R+' '+R+' 0 0 1 '+(W-t)+' '+(t+R)+'L'+(W-t)+' '+(H-t-R)+'A'+R+' '+R+' 0 0 1 '+(W-t-R)+' '+(H-t)+'L'+cx+' '+(H-t);
    var lp='M'+cx+' '+t+'L'+(t+R)+' '+t+'A'+R+' '+R+' 0 0 0 '+t+' '+(t+R)+'L'+t+' '+(H-t-R)+'A'+R+' '+R+' 0 0 0 '+(t+R)+' '+(H-t)+'L'+cx+' '+(H-t);
    ring.querySelector('.track').setAttribute('d',track);
    var col=grooveCol(g);
    [['.grR',rp],['.grL',lp]].forEach(function(a){var p=ring.querySelector(a[0]);p.setAttribute('d',a[1]);p.setAttribute('pathLength','100');p.style.strokeDasharray=g+' '+(100-g);p.style.stroke=col;});
  }
  function update(g){
    g=Math.max(0,Math.min(100,g));
    val.textContent=Math.round(g)+'%'; badgeTxt.textContent='GROOVE '+Math.round(g)+'%';
    var col=grooveCol(g); badge.style.color=col; badge.querySelector('svg').style.stroke=col;
    drawRing(g);
    rbfill.style.height=g+'%'; rbfill.style.background=col;
  }
  slider.oninput=function(){ update(+slider.value); };
  document.querySelectorAll('.tab').forEach(function(t){ t.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');}); t.classList.add('on');
    frame.className='frame opt'+t.dataset.opt; update(+slider.value);
  };});
  document.getElementById('drain').onclick=function(){
    var g=100; slider.value=100; update(100);
    var iv=setInterval(function(){ g-=2.5; if(g<=15){g=15;clearInterval(iv);} slider.value=g; update(g); },70);
  };
  window.addEventListener('resize',function(){ update(+slider.value); });
  setTimeout(function(){ update(100); },50);
</script>
</body>
</html>
