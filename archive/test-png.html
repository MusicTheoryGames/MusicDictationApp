<!DOCTYPE html>
<html>
<head>
    <title>PNG Test</title>
    <style>
        .test-container {
            display: grid;
            grid-template-columns: repeat(4, 200px);
            gap: 10px;
            padding: 20px;
        }
        .test-item {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        .test-item img {
            max-width: 100%;
            height: auto;
            border: 1px solid red;
        }
    </style>
</head>
<body>
    <h1>PNG Asset Test</h1>
    <div class="test-container">
        <div class="test-item">
            <h3>quarter.png</h3>
            <img src="./rhythm-assets/quarter.png" alt="Quarter" onerror="this.style.backgroundColor='red'" onload="this.style.backgroundColor='green'">
        </div>
        <div class="test-item">
            <h3>two-eighths.png</h3>
            <img src="./rhythm-assets/two-eighths.png" alt="Two Eighths" onerror="this.style.backgroundColor='red'" onload="this.style.backgroundColor='green'">
        </div>
        <div class="test-item">
            <h3>quarter-rest.png</h3>
            <img src="./rhythm-assets/quarter-rest.png" alt="Quarter Rest" onerror="this.style.backgroundColor='red'" onload="this.style.backgroundColor='green'">
        </div>
        <div class="test-item">
            <h3>half.png</h3>
            <img src="./rhythm-assets/half.png" alt="Half" onerror="this.style.backgroundColor='red'" onload="this.style.backgroundColor='green'">
        </div>
    </div>
</body>
</html>
