<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ear Arcade — Zen (concept)</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;}
  html,body{height:100%;overflow:hidden;font-family:"SF Pro Display",-apple-system,"Segoe UI",system-ui,sans-serif;background:#0e1116;}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:18px;background:#0b0d11;}
  .phone{position:relative;width:390px;height:800px;max-height:96vh;border-radius:40px;overflow:hidden;color:#f2ede6;
    box-shadow:0 30px 90px rgba(230,150,90,.12),0 4px 24px #0008;
    background:linear-gradient(180deg,#22304a 0%,#3a4666 30%,#8a6f8e 62%,#e0a170 84%,#f4c98a 100%);}
  .haze{position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 96%,#ffd9a355,transparent 60%);}
  .mist{position:absolute;left:-20%;right:-20%;bottom:20%;height:30%;background:linear-gradient(#fff0,#ffffff22);filter:blur(24px);animation:sway 16s ease-in-out infinite alternate;}
  @keyframes sway{to{transform:translateX(6%);}}
  .peak{position:absolute;bottom:16%;width:0;height:0;border-left:80px solid transparent;border-right:80px solid transparent;border-bottom:120px solid #2a3350;opacity:.5;}
  .peak.l{left:6%;} .peak.r{right:2%;border-bottom-color:#3a3352;height:0;border-bottom-width:150px;bottom:16%;}
  .hud{position:absolute;left:0;right:0;top:0;padding:30px 30px 0;z-index:5;}
  .brand{font-weight:300;letter-spacing:.5em;font-size:.72rem;opacity:.7;}
  .score{margin-top:20px;font-weight:200;font-size:3rem;letter-spacing:.02em;font-variant-numeric:tabular-nums;}
  .score span{font-size:.7rem;letter-spacing:.3em;opacity:.5;font-weight:400;margin-left:8px;}
  .prog{margin-top:16px;display:flex;gap:6px;}
  .prog i{height:3px;flex:1;background:#ffffff22;border-radius:2px;}
  .prog i.on{background:#f4c98a;box-shadow:0 0 8px #f4c98a99;}
  .combo{position:absolute;right:30px;top:40px;font-weight:200;font-size:1.4rem;opacity:0;transition:opacity .3s;letter-spacing:.02em;}
  .cue{position:absolute;left:0;right:0;top:210px;text-align:center;z-index:4;font-weight:300;letter-spacing:.16em;font-size:.8rem;opacity:.7;text-transform:uppercase;}
  .field{position:absolute;left:0;right:0;bottom:150px;display:flex;justify-content:center;gap:26px;z-index:4;}
  .stone{position:relative;width:80px;height:80px;border-radius:50%;cursor:pointer;
    background:radial-gradient(circle at 38% 32%,#fffdf8,#efe4d6 55%,#cfc0ad);box-shadow:0 10px 30px #0004,inset 0 -6px 12px #00000018,inset 0 3px 6px #fff;
    display:flex;align-items:center;justify-content:center;font-weight:300;font-size:1.7rem;color:#3a3550;animation:hover 5s ease-in-out infinite;}
  .stone:nth-child(2){animation-delay:-1.6s;}.stone:nth-child(3){animation-delay:-3.2s;}
  @keyframes hover{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
  .stone .ring{position:absolute;inset:0;border-radius:50%;border:2px solid #fff;opacity:0;pointer-events:none;}
  .stone.active{box-shadow:0 10px 30px #0004,inset 0 -6px 12px #00000018,inset 0 3px 6px #fff,0 0 0 3px #ffffff55,0 0 30px #ffd9a366;}
  .stone.hit .ring{animation:rip .7s ease-out;}
  @keyframes rip{0%{transform:scale(1);opacity:.9;}100%{transform:scale(1.9);opacity:0;}}
  .stone.hit{animation:sink .4s ease;}
  @keyframes sink{40%{transform:scale(.9);}100%{transform:scale(1);}}
  .float{position:absolute;z-index:9;font-weight:200;font-size:1.2rem;color:#fff;pointer-events:none;animation:rise 1.2s ease-out forwards;letter-spacing:.05em;}
  @keyframes rise{0%{opacity:0;transform:translateY(0);}25%{opacity:.9;}100%{opacity:0;transform:translateY(-46px);}}
  .foot{position:absolute;left:0;right:0;bottom:24px;text-align:center;z-index:6;}
  .labsys{display:flex;gap:8px;justify-content:center;margin-bottom:12px;}
  .labsys button{background:#ffffff16;border:1px solid #ffffff33;color:#f2ede6;font-weight:300;font-size:.72rem;padding:6px 14px;border-radius:999px;cursor:pointer;letter-spacing:.05em;}
  .labsys button.on{background:#ffffff30;border-color:#fff;}
  .hint{font-size:.7rem;opacity:.45;font-weight:300;letter-spacing:.04em;}
</style></head><body>
<div class="wrap"><div class="phone" id="phone">
  <div class="haze"></div><div class="peak l"></div><div class="peak r"></div><div class="mist"></div>
  <div class="hud"><div class="brand">EAR ARCADE</div><div class="score"><span id="score">0</span><span>POINTS</span></div>
    <div class="prog"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="combo" id="combo">×3</div>
  <div class="cue">the degree you hear</div>
  <div class="field" id="field"></div>
  <div class="foot"><div class="labsys" id="labsys"><button data-s="num" class="on">1̂ 3̂ 5̂</button><button data-s="mov">Moveable do</button><button data-s="fix">Fixed do</button></div><div class="hint">Concept · calm, precise — the note rings, you choose its degree</div></div>
</div></div>
<script>(()=>{
  const LAB={num:['1̂','2̂','3̂','4̂','5̂','6̂','7̂'],mov:['do','re','mi','fa','sol','la','ti'],fix:['do','re','mi','fa','sol','la','ti']};let SYS='num';
  const T=[{deg:1},{deg:3},{deg:5}],field=document.getElementById('field'),phone=document.getElementById('phone');
  const st=T.map(t=>{const el=document.createElement('div');el.className='stone';el.dataset.deg=t.deg;el.innerHTML=`<span class="l">${LAB[SYS][t.deg-1]}</span><div class="ring"></div>`;el.onpointerdown=()=>hit(t.deg,el);field.appendChild(el);return el;});
  const relabel=()=>st.forEach((el,i)=>{el.querySelector('.l').textContent=LAB[SYS][T[i].deg-1];el.querySelector('.l').style.fontSize=SYS==='num'?'1.7rem':'1.2rem';});
  let AC=null;const hz=d=>({1:523.25,3:659.25,5:783.99})[d]||523;
  function tone(d){try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),o2=AC.createOscillator();o.type='sine';o2.type='sine';o.frequency.value=hz(d);o2.frequency.value=hz(d)*3;const g2=AC.createGain();g2.gain.value=.06;o2.connect(g2);g2.connect(AC.destination);o.connect(g);g.connect(AC.destination);const t=AC.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.26,t+.03);g.gain.exponentialRampToValueAtTime(.0006,t+1.6);g2.gain.exponentialRampToValueAtTime(.0006,t+1.2);o.start(t);o2.start(t);o.stop(t+1.7);o2.stop(t+1.3);}catch(e){}}
  const scoreEl=document.getElementById('score'),combo=document.getElementById('combo');let score=0,c=0,active=1;
  function ring(){st.forEach(s=>s.classList.remove('active'));active=T[Math.floor(Math.random()*3)].deg;const el=st[T.findIndex(x=>x.deg===active)];el.classList.add('active');tone(active);}
  function hit(d,el){tone(d);el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),700);
    if(d===active){c++;score+=60+c*12;scoreEl.textContent=score.toLocaleString();combo.textContent='×'+c;combo.style.opacity=c>1?.85:0;const r=el.getBoundingClientRect(),p=phone.getBoundingClientRect();const f=document.createElement('div');f.className='float';f.textContent='+'+(60+c*12);f.style.left=(r.left-p.left+24)+'px';f.style.top=(r.top-p.top)+'px';phone.appendChild(f);setTimeout(()=>f.remove(),1200);}
    else{c=0;combo.style.opacity=0;}}
  ring();setInterval(ring,1800);
  document.querySelectorAll('#labsys button').forEach(x=>x.onpointerdown=()=>{SYS=x.dataset.s;document.querySelectorAll('#labsys button').forEach(y=>y.classList.toggle('on',y===x));relabel();});
})();</script></body></html>
