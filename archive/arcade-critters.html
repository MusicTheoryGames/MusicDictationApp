<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ear Arcade — Critters (concept)</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;}
  html,body{height:100%;overflow:hidden;font-family:"Baloo 2","Nunito",-apple-system,system-ui,sans-serif;background:#bfeeff;}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:18px;background:#9fd9ef;}
  .phone{position:relative;width:390px;height:800px;max-height:96vh;border-radius:40px;overflow:hidden;color:#3a2f5a;
    box-shadow:0 30px 90px rgba(60,120,90,.3),0 4px 24px #0006;background:linear-gradient(180deg,#8fe0ff,#c9f6e0 55%,#ffe9a8);}
  .cloud{position:absolute;background:#fff;border-radius:50px;opacity:.9;filter:drop-shadow(0 6px 0 #ffffff70);}
  .cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%;}
  .sun{position:absolute;top:40px;right:36px;width:74px;height:74px;border-radius:50%;background:radial-gradient(#fff6c9,#ffd23f);box-shadow:0 0 40px #ffd23f88;animation:spin 20s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .hill{position:absolute;left:-10%;right:-10%;bottom:0;height:40%;background:linear-gradient(#8fe36a,#5cc24a);border-radius:50% 50% 0 0;box-shadow:inset 0 8px 0 #ffffff55;}
  .hill.b{bottom:-4%;height:32%;background:linear-gradient(#a6ef7e,#6fd357);}
  .hud{position:absolute;left:0;right:0;top:0;padding:18px 20px;z-index:6;display:flex;justify-content:space-between;align-items:center;}
  .brand{font-weight:900;font-size:1.05rem;color:#ff7aa8;text-shadow:0 2px 0 #fff;}
  .score{background:#fff;border-radius:999px;padding:6px 16px;font-weight:900;font-size:1.15rem;color:#7b3fe4;box-shadow:0 4px 0 #e2d4ff;}
  .combo{position:absolute;left:50%;top:110px;transform:translateX(-50%);z-index:6;background:#ffd23f;color:#7a4b00;font-weight:900;
    padding:5px 16px;border-radius:999px;box-shadow:0 4px 0 #e0a800;opacity:0;transition:transform .12s;font-size:1.05rem;}
  .cue{position:absolute;left:0;right:0;top:150px;text-align:center;z-index:5;font-weight:800;color:#4a3a6a;font-size:.95rem;opacity:.85;}
  .field{position:absolute;left:0;right:0;bottom:150px;display:flex;justify-content:center;gap:16px;z-index:4;}
  .critter{position:relative;width:98px;height:120px;cursor:pointer;transform-origin:50% 100%;}
  .critter .body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);animation:bob 2.2s ease-in-out infinite;}
  .critter:nth-child(2) .body{animation-delay:-.7s;}.critter:nth-child(3) .body{animation-delay:-1.4s;}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-8px);}}
  .critter .sign{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:#fff;border:3px solid #b98a4a;border-radius:12px;
    padding:1px 10px;font-weight:900;font-size:1.35rem;color:#6b4a1c;box-shadow:0 3px 0 #b98a4a;z-index:2;}
  .critter.hit .body{animation:pop .4s cubic-bezier(.2,1.5,.4,1);}
  @keyframes pop{0%{transform:translateX(-50%) scale(1);}30%{transform:translateX(-50%) scale(1.18,.85);}60%{transform:translateX(-50%) scale(.94,1.1);}100%{transform:translateX(-50%) scale(1);}}
  .burrow{position:absolute;bottom:130px;left:0;right:0;display:flex;justify-content:center;gap:16px;z-index:3;}
  .burrow div{width:98px;height:26px;border-radius:50%;background:radial-gradient(#6b4a1c,#3a2710);box-shadow:inset 0 6px 8px #0007;}
  .foot{position:absolute;left:0;right:0;bottom:20px;text-align:center;z-index:7;}
  .labsys{display:flex;gap:8px;justify-content:center;margin-bottom:10px;}
  .labsys button{background:#ffffffcc;border:2px solid #ffd23f;color:#7a4b00;font-weight:800;font-size:.72rem;padding:5px 12px;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 #e0a800;}
  .labsys button.on{background:#ffd23f;color:#5a3800;}
  .hint{font-size:.72rem;color:#5a4a7a;opacity:.7;font-weight:700;}
  .conf{position:absolute;width:10px;height:14px;z-index:8;pointer-events:none;border-radius:2px;}
  .star{position:absolute;z-index:9;pointer-events:none;animation:sr .9s ease-out forwards;}
  @keyframes sr{0%{transform:scale(.4) rotate(0);opacity:0;}25%{opacity:1;}100%{transform:scale(1.2) translateY(-50px) rotate(40deg);opacity:0;}}
</style></head><body>
<div class="wrap"><div class="phone" id="phone">
  <div class="sun"></div>
  <div class="cloud" style="top:70px;left:30px;width:70px;height:26px"></div>
  <div class="cloud" style="top:130px;left:180px;width:54px;height:20px"></div>
  <div class="hill b"></div><div class="hill"></div>
  <div class="hud"><span class="brand">Ear Arcade</span><span class="score" id="score">0</span></div>
  <div class="combo" id="combo">×3 combo!</div>
  <div class="cue">Bop the critter you hear</div>
  <div class="burrow"><div></div><div></div><div></div></div>
  <div class="field" id="field"></div>
  <div class="foot"><div class="labsys" id="labsys"><button data-s="num" class="on">1̂ 3̂ 5̂</button><button data-s="mov">Moveable do</button><button data-s="fix">Fixed do</button></div><div class="hint">Concept · a critter squeaks a note — bop the right one!</div></div>
</div></div>
<script>(()=>{
  const LAB={num:['1̂','2̂','3̂','4̂','5̂','6̂','7̂'],mov:['do','re','mi','fa','sol','la','ti'],fix:['do','re','mi','fa','sol','la','ti']};let SYS='num';
  const T=[{deg:1,c:'#ff8fb0'},{deg:3,c:'#7fc9ff'},{deg:5,c:'#9be36a'}],field=document.getElementById('field'),phone=document.getElementById('phone');
  const body=c=>`<svg width="88" height="96" viewBox="0 0 88 96"><ellipse cx="44" cy="60" rx="34" ry="34" fill="${c}"/><ellipse cx="44" cy="86" rx="30" ry="10" fill="#00000018"/><circle cx="32" cy="54" r="6.5" fill="#fff"/><circle cx="56" cy="54" r="6.5" fill="#fff"/><circle cx="33" cy="55" r="3" fill="#241"/><circle cx="57" cy="55" r="3" fill="#241"/><ellipse cx="44" cy="66" rx="5" ry="4" fill="#5a2a3a"/><path d="M30 40q14 -14 28 0" stroke="${c}" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="26" cy="34" r="8" fill="${c}"/><circle cx="62" cy="34" r="8" fill="${c}"/><circle cx="34" cy="72" r="4" fill="#ffffff55"/><circle cx="54" cy="72" r="4" fill="#ffffff55"/></svg>`;
  const crit=T.map((t,i)=>{const el=document.createElement('div');el.className='critter';el.innerHTML=`<div class="sign">${LAB[SYS][t.deg-1]}</div><div class="body">${body(t.c)}</div>`;el.onpointerdown=()=>hit(t.deg,el);field.appendChild(el);return el;});
  const relabel=()=>crit.forEach((el,i)=>{el.querySelector('.sign').textContent=LAB[SYS][T[i].deg-1];});
  let AC=null;const hz=d=>({1:523.25,3:659.25,5:783.99})[d]||523;
  function tone(d){try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=hz(d);o.connect(g);g.connect(AC.destination);const t=AC.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.frequency.setValueAtTime(hz(d),t);o.frequency.linearRampToValueAtTime(hz(d)*1.02,t+.3);o.start(t);o.stop(t+.62);}catch(e){}}
  const scoreEl=document.getElementById('score'),combo=document.getElementById('combo');let score=0,c=0,active=1;
  function ping(){active=T[Math.floor(Math.random()*3)].deg;tone(active);const el=crit[T.findIndex(x=>x.deg===active)];el.querySelector('.body').animate([{transform:'translateX(-50%) translateY(0)'},{transform:'translateX(-50%) translateY(-14px)'},{transform:'translateX(-50%) translateY(0)'}],{duration:400});}
  function hit(d,el){tone(d);el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),400);
    if(d===active){c++;score+=50+c*10;scoreEl.textContent=score.toLocaleString();combo.textContent='×'+c+' combo!';combo.style.opacity=c>1?1:0;combo.animate([{transform:'translateX(-50%) scale(1.3)'},{transform:'translateX(-50%) scale(1)'}],{duration:200});confetti(el);star(el);}
    else{c=0;combo.style.opacity=0;el.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:200});}}
  function confetti(el){const r=el.getBoundingClientRect(),p=phone.getBoundingClientRect(),cx=r.left-p.left+r.width/2,cy=r.top-p.top+10,cols=['#ff8fb0','#7fc9ff','#9be36a','#ffd23f','#c89bff'];
    for(let k=0;k<16;k++){const s=document.createElement('div');s.className='conf';s.style.background=cols[k%cols.length];s.style.left=cx+'px';s.style.top=cy+'px';const a=-Math.PI/2+(Math.random()-.5)*2.4,d=40+Math.random()*80;phone.appendChild(s);s.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+30}px) rotate(${Math.random()*360}deg)`,opacity:0}],{duration:800,easing:'cubic-bezier(.2,.6,.4,1)'});setTimeout(()=>s.remove(),820);}}
  function star(el){const r=el.getBoundingClientRect(),p=phone.getBoundingClientRect();const s=document.createElement('div');s.className='star';s.innerHTML='<svg width="40" height="40" viewBox="0 0 24 24"><path fill="#ffd23f" stroke="#ffb703" stroke-width="1" d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.8 5.9 20.4 7.3 13.6 2.2 9l6.9-.7z"/></svg>';s.style.left=(r.left-p.left+30)+'px';s.style.top=(r.top-p.top-10)+'px';phone.appendChild(s);setTimeout(()=>s.remove(),900);}
  ping();setInterval(ping,1600);
  document.querySelectorAll('#labsys button').forEach(x=>x.onpointerdown=()=>{SYS=x.dataset.s;document.querySelectorAll('#labsys button').forEach(y=>y.classList.toggle('on',y===x));relabel();});
})();</script></body></html>
