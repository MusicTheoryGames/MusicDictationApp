<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ear Arcade — Aurora (concept)</title>
<style>
  :root{
    --bg0:#080512; --bg1:#140a33; --teal:#2ff3c8; --violet:#a678ff; --pink:#ff5c9d; --gold:#ffd36b;
    --ink:#eef0ff;
    font-family:-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#04030a;color:var(--ink);overflow:hidden;}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:18px;
    background:radial-gradient(120% 80% at 50% -10%,#1a0f42,#04030a 70%);}
  .phone{position:relative;width:390px;height:800px;max-height:96vh;border-radius:40px;overflow:hidden;
    box-shadow:0 40px 120px rgba(90,40,180,.35),0 4px 30px rgba(0,0,0,.6);isolation:isolate;}

  /* ---------- atmosphere ---------- */
  .sky{position:absolute;inset:0;background:linear-gradient(180deg,#0a0620 0%,#160b3e 46%,#241056 74%,#3a1660 100%);}
  .aurora{position:absolute;inset:-20% -30%;filter:blur(46px);opacity:.55;mix-blend-mode:screen;
    background:
      radial-gradient(40% 30% at 25% 40%,#2ff3c8aa,transparent 70%),
      radial-gradient(46% 34% at 72% 34%,#a678ffbb,transparent 72%),
      radial-gradient(50% 30% at 50% 62%,#ff5c9d88,transparent 74%);
    animation:drift 14s ease-in-out infinite alternate;}
  @keyframes drift{0%{transform:translate3d(-4%,-2%,0) scale(1.05) rotate(-3deg);}100%{transform:translate3d(5%,3%,0) scale(1.15) rotate(4deg);}}
  .stars{position:absolute;inset:0;}
  .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.7;animation:tw 3.2s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.2;transform:scale(.7);}50%{opacity:.95;transform:scale(1.15);}}
  .horizon{position:absolute;left:-10%;right:-10%;bottom:-6%;height:44%;border-radius:50% 50% 0 0;
    background:radial-gradient(60% 120% at 50% 0,#5a2a9a55,transparent 70%);
    box-shadow:0 -1px 40px #a678ff44;}
  .bloom{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 40% at 50% 46%,#ffffff00,transparent);
    mix-blend-mode:screen;opacity:0;transition:opacity .12s;}

  /* ---------- HUD ---------- */
  .hud{position:absolute;left:0;right:0;top:0;padding:20px 22px 0;z-index:5;}
  .row{display:flex;align-items:center;justify-content:space-between;}
  .brand{font-weight:800;letter-spacing:.26em;font-size:.68rem;color:#cbb6ff;opacity:.85;}
  .conste{margin-top:14px;position:relative;height:26px;}
  .conste svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .score{margin-top:16px;display:flex;align-items:baseline;gap:10px;}
  .score .n{font-size:2.5rem;font-weight:800;letter-spacing:.01em;
    text-shadow:0 0 22px #a678ff66;font-variant-numeric:tabular-nums;}
  .score .u{font-size:.8rem;opacity:.55;letter-spacing:.18em;}
  .combo{position:absolute;right:22px;top:74px;text-align:right;transition:transform .12s;}
  .combo b{font-size:1.5rem;font-weight:900;letter-spacing:.02em;display:block;line-height:1;}
  .combo small{font-size:.6rem;letter-spacing:.24em;opacity:.6;}
  .combo.bump{transform:scale(1.28);}

  /* ---------- prompt ---------- */
  .cue{position:absolute;left:0;right:0;top:186px;text-align:center;z-index:4;
    font-size:.86rem;letter-spacing:.02em;color:#e8e2ff;opacity:.8;}
  .wave{position:absolute;left:50%;top:238px;width:14px;height:14px;border-radius:50%;transform:translateX(-50%);
    background:#fff;box-shadow:0 0 20px #fff;z-index:4;}
  .wave.on{animation:wave .6s ease-out;}
  @keyframes wave{0%{transform:translateX(-50%) scale(.5);opacity:.9;box-shadow:0 0 14px #fff,0 0 0 0 #ffffff66;}
    100%{transform:translateX(-50%) scale(1);opacity:.2;box-shadow:0 0 14px #fff,0 0 0 60px #ffffff00;}}

  /* ---------- crystals ---------- */
  .field{position:absolute;left:0;right:0;bottom:96px;top:300px;display:flex;align-items:center;justify-content:center;gap:18px;z-index:3;}
  .cry{position:relative;width:96px;height:120px;cursor:pointer;transform-origin:50% 70%;animation:float 4.2s ease-in-out infinite;}
  .cry:nth-child(2){animation-delay:-1.4s;} .cry:nth-child(3){animation-delay:-2.6s;}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-9px) rotate(1.5deg);}}
  .cry svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 18px #0007);}
  .cry .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:2rem;font-weight:900;color:#fff;text-shadow:0 2px 10px #0009,0 0 18px #ffffffaa;pointer-events:none;
    padding-bottom:6px;}
  .cry.active{animation:none;}
  .cry.active svg{filter:drop-shadow(0 0 26px var(--glow)) drop-shadow(0 10px 18px #0007);}
  .cry .halo{position:absolute;inset:-18px;border-radius:50%;pointer-events:none;opacity:0;
    background:radial-gradient(closest-side,var(--glow),transparent 70%);}
  .cry.active .halo{opacity:.9;animation:halo 1.2s ease-in-out infinite;}
  @keyframes halo{0%,100%{transform:scale(.85);opacity:.5;}50%{transform:scale(1.12);opacity:1;}}
  .cry.hit{animation:whack .42s cubic-bezier(.2,1.4,.35,1);}
  @keyframes whack{0%{transform:scale(1);}18%{transform:scale(.7,1.18);}50%{transform:scale(1.22,.82);}100%{transform:scale(1);}}

  .float{position:absolute;z-index:9;font-weight:900;font-size:1.3rem;color:var(--gold);text-shadow:0 2px 10px #0009;
    pointer-events:none;animation:rise 1s ease-out forwards;}
  @keyframes rise{0%{transform:translateY(0) scale(.7);opacity:0;}20%{opacity:1;}100%{transform:translateY(-70px) scale(1.1);opacity:0;}}
  .shard{position:absolute;z-index:8;width:9px;height:9px;border-radius:2px;pointer-events:none;}

  /* ---------- footer ---------- */
  .foot{position:absolute;left:0;right:0;bottom:22px;text-align:center;z-index:6;}
  .foot button{background:linear-gradient(180deg,#2ff3c8,#12b79a);color:#032;border:none;font-weight:800;
    padding:13px 30px;border-radius:16px;font-size:1rem;letter-spacing:.02em;cursor:pointer;
    box-shadow:0 8px 0 #0a6e5c,0 14px 26px #0008;}
  .foot .hint{margin-top:10px;font-size:.72rem;opacity:.5;letter-spacing:.03em;}
  .labsys{display:flex;gap:8px;justify-content:center;margin-bottom:12px;}
  .foot .labsys button{background:#ffffff14;border:1px solid #ffffff2e;color:#cbb6ff;font-weight:700;
    font-size:.72rem;padding:6px 13px;border-radius:999px;cursor:pointer;letter-spacing:.02em;box-shadow:none;}
  .foot .labsys button.on{background:#ffffff2e;color:#fff;border-color:#ffffff88;}
</style>
</head>
<body>
<div class="wrap">
  <div class="phone" id="phone">
    <div class="sky"></div>
    <div class="aurora"></div>
    <div class="stars" id="stars"></div>
    <div class="horizon"></div>
    <div class="bloom" id="bloom"></div>

    <div class="hud">
      <div class="row"><span class="brand">EAR ARCADE</span><span class="brand" style="opacity:.5">TRIAD · 1&nbsp;3&nbsp;5</span></div>
      <div class="conste"><svg viewBox="0 0 340 26" id="consteSvg"></svg></div>
      <div class="score"><span class="n" id="score">0</span><span class="u">POINTS</span></div>
    </div>
    <div class="combo" id="combo"><b id="comboN" style="opacity:0">×2</b><small>COMBO</small></div>

    <div class="cue">Whack the degree you hear</div>
    <div class="wave" id="wave"></div>

    <div class="field" id="field">
      <!-- crystals injected -->
    </div>

    <div class="foot">
      <div class="labsys" id="labsys">
        <button data-s="num" class="on">1̂ 3̂ 5̂</button>
        <button data-s="mov">Moveable do</button>
        <button data-s="fix">Fixed do</button>
      </div>
      <button id="go">Tap a crystal</button>
      <div class="hint">Concept · labels follow your Settings choice · tap a glowing crystal to feel the juice</div>
    </div>
  </div>
</div>

<script>
(() => {
  // ---- starfield ----
  const stars = document.getElementById('stars');
  for (let i=0;i<70;i++){ const s=document.createElement('i');
    s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*70+'%';
    s.style.animationDelay=(Math.random()*3.2)+'s'; s.style.opacity=(.3+Math.random()*.6);
    if(Math.random()<.2){s.style.width=s.style.height='3px';} stars.appendChild(s); }

  // ---- crystals (the labelled targets) ----
  // Labels follow the app's Settings choice (numbers / moveable do / fixed do) — the real arcade pulls
  // these from services.labelPalette(). Here we mirror it so the concept relabels live.
  const LABELS={num:['1̂','2̂','3̂','4̂','5̂','6̂','7̂'],mov:['do','re','mi','fa','sol','la','ti'],fix:['do','re','mi','fa','sol','la','ti']};
  let SYS='num';
  const labelFor=(deg)=>LABELS[SYS][deg-1];
  const TARGETS = [{deg:1,glow:'#2ff3c8',g1:'#7dffe6',g2:'#0f9e86'},
                   {deg:3,glow:'#a678ff',g1:'#cbb0ff',g2:'#5b2fbf'},
                   {deg:5,glow:'#ff5c9d',g1:'#ffa6c9',g2:'#c02766'}];
  const field=document.getElementById('field');
  const crystalSVG=(g1,g2)=>`<svg viewBox="0 0 96 120"><defs>
      <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${g1}"/><stop offset="1" stop-color="${g2}"/></linearGradient></defs>
      <polygon points="48,4 86,40 68,116 28,116 10,40" fill="url(#lg)" stroke="#ffffff55" stroke-width="1.5"/>
      <polygon points="48,4 68,116 48,120 48,4" fill="#ffffff2e"/>
      <polygon points="48,4 28,116 48,120 48,4" fill="#00000022"/>
      <polygon points="48,4 86,40 62,44" fill="#ffffff55"/>
    </svg>`;
  const crys=TARGETS.map((t,i)=>{
    const el=document.createElement('div'); el.className='cry'; el.style.setProperty('--glow',t.glow);
    el.innerHTML=`<div class="halo"></div>${crystalSVG(t.g1,t.g2)}<div class="lbl">${labelFor(t.deg)}</div>`;
    el.addEventListener('pointerdown',()=>hit(i,el));
    field.appendChild(el); return el;
  });
  function relabel(){ crys.forEach((el,i)=>{ el.querySelector('.lbl').textContent=labelFor(TARGETS[i].deg);
    el.querySelector('.lbl').style.fontSize=SYS==='num'?'2rem':'1.35rem'; }); }

  // ---- constellation progress (8 stages -> stars connecting) ----
  const cs=document.getElementById('consteSvg'); const N=8, lit=3;
  let pts=[];
  for(let i=0;i<N;i++){ const x=14+i*(312/(N-1)); const y=13+(i%2?6:-4);
    pts.push([x,y]);
    if(i>0){ const [px,py]=pts[i-1]; const on=i<=lit;
      cs.insertAdjacentHTML('beforeend',`<line x1="${px}" y1="${py}" x2="${x}" y2="${y}" stroke="${on?'#ffd36b':'#ffffff20'}" stroke-width="${on?2:1}" ${on?'':'stroke-dasharray="2 3"'}/>`);}
  }
  pts.forEach(([x,y],i)=>{ const on=i<lit; const cur=i===lit;
    cs.insertAdjacentHTML('beforeend',`<circle cx="${x}" cy="${y}" r="${cur?4:3}" fill="${on?'#ffd36b':cur?'#fff':'#ffffff35'}" ${on||cur?`style="filter:drop-shadow(0 0 6px ${on?'#ffd36b':'#fff'})"`:''}/>`);});

  // ---- audio (soft bell so the concept feels alive) ----
  let AC=null; const hz=deg=>({1:523.25,3:659.25,5:783.99})[deg]||523;
  function tone(deg){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),o2=AC.createOscillator();
    o.type='sine';o2.type='triangle';o.frequency.value=hz(deg);o2.frequency.value=hz(deg)*2;
    g.gain.value=0;o.connect(g);o2.connect(g);g.connect(AC.destination);
    const t=AC.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.28,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+.9);
    o.start(t);o2.start(t);o.stop(t+.95);o2.stop(t+.95);}catch(e){} }

  // ---- game feel ----
  const scoreEl=document.getElementById('score'), comboEl=document.getElementById('combo'), comboN=document.getElementById('comboN');
  const wave=document.getElementById('wave'), bloom=document.getElementById('bloom'), phone=document.getElementById('phone');
  let score=0, combo=0, active=-1;

  function setActive(i){ crys.forEach((c,k)=>c.classList.toggle('active',k===i)); active=i;
    wave.classList.remove('on'); void wave.offsetWidth; wave.classList.add('on'); tone(TARGETS[i].deg); }

  function comboColor(c){ return c>=12?'#fff':c>=8?'#ff5c9d':c>=5?'#ffd36b':c>=3?'#2ff3c8':'#cbb6ff'; }

  function hit(i,el){
    const right = i===active;
    tone(TARGETS[i].deg);
    el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
    burst(el, right?TARGETS[i].glow:'#ff5c6b', right?16:6);
    if(right){
      combo++; const gain=80+combo*12; score+=gain; scoreEl.textContent=score.toLocaleString();
      floatText(el,'+'+gain,'#ffd36b');
      comboN.style.opacity=combo>1?1:0; comboN.textContent='×'+combo; comboN.style.color=comboColor(combo);
      comboN.style.fontSize=(1.3+Math.min(combo,14)*.06)+'rem';
      comboEl.classList.remove('bump'); void comboEl.offsetWidth; comboEl.classList.add('bump');
      bloom.style.background='radial-gradient(60% 40% at 50% 56%,'+TARGETS[i].glow+'55,transparent)';
      bloom.style.opacity=Math.min(.5,.18+combo*.03); setTimeout(()=>bloom.style.opacity=0,120);
      if(combo%4===0){ shake(); }
    } else {
      combo=0; comboN.style.opacity=0; floatText(el,'miss','#ff8a94');
      phone.animate([{filter:'brightness(1)'},{filter:'brightness(.7) saturate(1.4)'},{filter:'brightness(1)'}],{duration:260});
    }
  }
  function shake(){ phone.animate([{transform:'translate(0,0)'},{transform:'translate(-4px,2px)'},{transform:'translate(4px,-2px)'},{transform:'translate(-2px,1px)'},{transform:'translate(0,0)'}],{duration:220}); }
  function floatText(el,txt,col){ const r=el.getBoundingClientRect(),p=phone.getBoundingClientRect();
    const f=document.createElement('div');f.className='float';f.textContent=txt;f.style.color=col;
    f.style.left=(r.left-p.left+r.width/2-14)+'px';f.style.top=(r.top-p.top+6)+'px';phone.appendChild(f);setTimeout(()=>f.remove(),1000);}
  function burst(el,col,n){ const r=el.getBoundingClientRect(),p=phone.getBoundingClientRect();
    const cx=r.left-p.left+r.width/2, cy=r.top-p.top+r.height*.42;
    for(let k=0;k<n;k++){ const s=document.createElement('div');s.className='shard';
      const hue=Math.random()<.5?col:'#ffffff'; s.style.background=hue;s.style.boxShadow='0 0 8px '+hue;
      s.style.left=cx+'px';s.style.top=cy+'px';const a=Math.random()*Math.PI*2,dist=40+Math.random()*70;
      phone.appendChild(s);
      s.animate([{transform:'translate(0,0) scale(1)',opacity:1},
        {transform:`translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist}px) scale(0)`,opacity:0}],
        {duration:500+Math.random()*300,easing:'cubic-bezier(.1,.7,.3,1)'});
      setTimeout(()=>s.remove(),820);} }

  // ---- demo loop: cycle which note is "sounding" so the scene is alive; user taps to play ----
  let di=0; setActive(Math.floor(Math.random()*3));
  setInterval(()=>{ di=(di+1)%3; setActive((active+1+Math.floor(Math.random()*2))%3); },1400);
  // gentle auto-juice so it breathes even untouched
  setInterval(()=>{ if(document.hidden)return; const i=active>=0?active:0; /* occasional sparkle */
    if(Math.random()<.5) burst(crys[i],TARGETS[i].glow,4); },2600);

  document.getElementById('go').addEventListener('pointerdown',()=>{ if(active>=0) hit(active,crys[active]); });

  // label-system toggle (numbers / moveable do / fixed do) — mirrors the app's Settings choice
  document.querySelectorAll('#labsys button').forEach((btn)=>btn.addEventListener('pointerdown',()=>{
    SYS=btn.dataset.s; document.querySelectorAll('#labsys button').forEach((b)=>b.classList.toggle('on',b===btn)); relabel();
  }));
})();
</script>
</body>
</html>
