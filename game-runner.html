<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ear Arcade — Contour Runner</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;overflow:hidden;font-family:-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;background:#061024;color:#eaf2ff;}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:18px;background:#04081a;}
  .phone{position:relative;width:390px;height:800px;max-height:96vh;border-radius:40px;overflow:hidden;
    background:linear-gradient(180deg,#0a1a4a,#123a7a 55%,#2a6ea8);box-shadow:0 40px 120px rgba(40,120,220,.22),0 4px 30px #000a;}
  .stars{position:absolute;inset:0;} .stars i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.5;}
  .hud{position:absolute;left:0;right:0;top:0;padding:20px 22px 0;z-index:6;display:flex;justify-content:space-between;align-items:flex-start;}
  .brand{font-weight:900;letter-spacing:.06em;font-size:.9rem;}.brand small{display:block;font-weight:500;font-size:.58rem;opacity:.6;}
  .lives{font-size:1.05rem;letter-spacing:2px;}
  .h{position:absolute;right:22px;top:60px;text-align:right;z-index:6;} .h b{font-size:1.5rem;font-weight:900;} .h small{display:block;font-size:.5rem;letter-spacing:.2em;opacity:.6;}
  .combo{position:absolute;left:22px;top:60px;z-index:6;font-weight:800;font-size:.95rem;opacity:0;transition:opacity .2s;}
  .combo.on{opacity:.9;}
  .cue{position:absolute;left:0;right:0;top:108px;text-align:center;z-index:6;font-size:.72rem;letter-spacing:.14em;opacity:.75;text-transform:uppercase;}
  /* lanes */
  .track{position:absolute;left:0;right:0;top:150px;bottom:132px;z-index:2;}
  .lane{position:absolute;left:0;right:0;height:33.33%;border-top:1px dashed #ffffff22;}
  .lane .side{position:absolute;left:10px;top:6px;font-size:.62rem;font-weight:800;opacity:.28;letter-spacing:.1em;}
  .lane.hi{top:0;} .lane.mid{top:33.33%;} .lane.lo{top:66.66%;}
  .goalline{position:absolute;top:0;bottom:0;width:2px;background:#ffffff44;z-index:3;} /* where notes must be matched */
  .trailwrap{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
  .dot{position:absolute;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 10px currentColor;}
  .gate{position:absolute;width:34px;height:34px;border-radius:9px;transform:translate(-50%,-50%);z-index:3;
    border:2px solid #ffe9a8;background:#ffffff18;box-shadow:0 0 16px #ffd36b88;display:flex;align-items:center;justify-content:center;}
  .runner{position:absolute;width:46px;height:46px;transform:translate(-50%,-50%);z-index:5;transition:top .16s cubic-bezier(.3,-.3,.4,1.3);}
  .runner.hit{animation:pop .3s;} @keyframes pop{40%{transform:translate(-50%,-50%) scale(1.25);}}
  .runner.stumb{animation:shk .3s;} @keyframes shk{25%{transform:translate(-64%,-50%);}75%{transform:translate(-36%,-50%);}}
  /* controls */
  .zones{position:absolute;left:0;right:0;top:150px;bottom:132px;z-index:4;display:flex;flex-direction:column;}
  .zones div{flex:1;}
  .chev{position:absolute;right:16px;z-index:5;font-size:1.4rem;opacity:.5;color:#fff;pointer-events:none;}
  .chev.up{top:168px;} .chev.dn{bottom:150px;}
  .foot{position:absolute;left:0;right:0;bottom:22px;text-align:center;z-index:7;}
  .go{background:linear-gradient(180deg,#ffd36b,#f0a93a);color:#5a3800;border:none;font-weight:800;padding:12px 30px;border-radius:16px;font-size:1rem;cursor:pointer;box-shadow:0 8px 0 #b47a17,0 14px 26px #0008;}
  .labsys{display:flex;gap:8px;justify-content:center;margin-bottom:11px;}
  .labsys button{background:#ffffff1c;border:1px solid #ffffff3a;color:#eaf2ff;font-weight:700;font-size:.7rem;padding:6px 12px;border-radius:999px;cursor:pointer;}
  .labsys button.on{background:#ffffff36;border-color:#fff;}
  .hint{margin-top:9px;font-size:.66rem;opacity:.5;line-height:1.4;padding:0 20px;}
  .over{position:absolute;inset:0;z-index:12;background:#04081add;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;}
  .over.show{display:flex;} .over h2{font-size:1.4rem;}
</style></head><body>
<div class="wrap"><div class="phone" id="phone">
  <div class="stars" id="stars"></div>
  <div class="hud"><div class="brand">CONTOUR RUNNER<small>run the shape of the tune</small></div><div class="lives" id="lives">♥♥♥</div></div>
  <div class="combo" id="combo">x0</div>
  <div class="h"><b id="score">0</b><small>SCORE</small></div>
  <div class="cue" id="cue">Tap Start</div>
  <div class="track" id="track">
    <div class="lane hi"><span class="side" id="sHi">high</span></div>
    <div class="lane mid"><span class="side" id="sMid">mid</span></div>
    <div class="lane lo"><span class="side" id="sLo">low</span></div>
    <div class="trailwrap" id="trailwrap"></div>
    <div class="goalline" id="goalline"></div>
    <div class="gate" id="gate" style="display:none"></div>
    <div class="runner" id="runner"><svg width="46" height="46" viewBox="0 0 52 52"><ellipse cx="26" cy="46" rx="14" ry="4" fill="#00000022"/><circle cx="26" cy="26" r="17" fill="#ff8f4c"/><circle cx="20" cy="22" r="4" fill="#fff"/><circle cx="33" cy="22" r="4" fill="#fff"/><circle cx="21" cy="23" r="1.8" fill="#222"/><circle cx="34" cy="23" r="1.8" fill="#222"/><path d="M20 32q6 5 12 0" stroke="#7a3a12" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg></div>
  </div>
  <div class="zones" id="zones"><div id="zUp"></div><div id="zDn"></div></div>
  <div class="chev up">▲</div><div class="chev dn">▼</div>
  <div class="foot"><div class="labsys" id="labsys"><button data-s="num" class="on">1̂ 3̂ 5̂</button><button data-s="mov">Moveable do</button><button data-s="fix">Fixed do</button></div>
    <button class="go" id="go">Start</button>
    <div class="hint">Home plays first. Then a note sounds — HOP the runner to its pitch height before it reaches the line. Your path traces the melody.</div></div>
  <div class="over" id="over"><h2 id="overttl">Nice run!</h2><div id="oversub" style="opacity:.75;font-size:.85rem"></div><button class="go" id="again">Run again</button></div>
</div></div>
<script>(()=>{
  const st=document.getElementById('stars');for(let i=0;i<46;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.top=Math.random()*46+'%';st.appendChild(s);}
  const LAB={num:['1̂','2̂','3̂','4̂','5̂','6̂','7̂'],mov:['do','re','mi','fa','sol','la','ti'],fix:['do','re','mi','fa','sol','la','ti']};let SYS='num';
  // lane index: 0=low(1̂) 1=mid(3̂) 2=high(5̂)
  const LANE_DEG=[1,3,5], LANE_COL=['#7fe0a0','#ffd36b','#7fb8ff'];
  const track=document.getElementById('track'),runner=document.getElementById('runner'),gate=document.getElementById('gate'),trailwrap=document.getElementById('trailwrap'),goalline=document.getElementById('goalline');
  const cue=document.getElementById('cue'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),comboEl=document.getElementById('combo'),over=document.getElementById('over');
  let AC=null;const midi=d=>({1:60,3:64,5:67})[d],hz=m=>440*Math.pow(2,(m-69)/12);
  function tone(d,long){try{AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();o.type='sine';o2.type='triangle';o.frequency.value=hz(midi(d));o2.frequency.value=hz(midi(d))*2;const g2=AC.createGain();g2.gain.value=.07;o2.connect(g2);g2.connect(AC.destination);o.connect(g);g.connect(AC.destination);const t=AC.currentTime,dur=long?.6:.45;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.28,t+.02);g.gain.exponentialRampToValueAtTime(.0006,t+dur);g2.gain.exponentialRampToValueAtTime(.0004,t+dur*.7);o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur);}catch(e){}}
  const W=390, GOALX=96;            // runner + goal line x
  const laneY=l=>{const h=track.clientHeight;return h*(1/6 + (2-l)/3);}; // l:0 low(bottom)..2 high(top)
  let lane=0,target=0,score=0,lives=3,combo=0,playing=false,react=1200,timers=[],busy=false;
  function place(){runner.style.left=GOALX+'px';runner.style.top=laneY(lane)+'px';}
  goalline.style.left=GOALX+'px';
  function relabel(){document.getElementById('sHi').textContent=LAB[SYS][4];document.getElementById('sMid').textContent=LAB[SYS][2];document.getElementById('sLo').textContent=LAB[SYS][0];}
  function hop(dir){ if(!playing)return; const nl=Math.max(0,Math.min(2,lane+dir)); if(nl!==lane){lane=nl;runner.style.top=laneY(lane)+'px';tone(LANE_DEG[lane]);} }
  document.getElementById('zUp').onpointerdown=()=>hop(1);
  document.getElementById('zDn').onpointerdown=()=>hop(-1);
  const T=(f,ms)=>{const id=setTimeout(f,ms);timers.push(id);return id;};
  function clearTimers(){timers.forEach(clearTimeout);timers=[];}
  function anchorHome(cb){ cue.textContent='home = '+LAB[SYS][0]; lane=0; runner.style.top=laneY(0)+'px'; tone(1,true); T(cb,1000); }
  function nextNote(){ if(!playing)return; busy=true; target=Math.floor(Math.random()*3); tone(LANE_DEG[target]); cue.textContent='hop to what you hear';
    // gate flies in from the right to the goal line at the TARGET lane
    gate.style.display='flex'; gate.style.color=LANE_COL[target]; gate.style.borderColor=LANE_COL[target];
    gate.style.top=laneY(target)+'px'; gate.style.left=(W+30)+'px'; gate.style.transition='none';
    void gate.offsetWidth; gate.style.transition='left '+react+'ms linear'; gate.style.left=GOALX+'px';
    T(judge,react); }
  function judge(){ if(!playing)return; const ok=lane===target;
    // trail dot at the choice (your path); green=right lane, red=wrong
    const d=document.createElement('div'); d.className='dot'; d.style.left=GOALX+'px'; d.style.top=laneY(lane)+'px'; d.style.color=ok?'#6bffb0':'#ff6b8a'; d.style.background=ok?'#6bffb0':'#ff6b8a'; trailwrap.appendChild(d);
    d.animate([{transform:'translate(-50%,-50%)',opacity:.95},{left:'-20px',opacity:0}],{duration:react*3.2,easing:'linear'});
    d.style.left=(GOALX-20)+'px'; // drift left with the world
    setTimeout(()=>d.remove(),react*3.2);
    gate.style.display='none';
    if(ok){ combo++; score+=10+combo*2; scoreEl.textContent=score; comboEl.textContent='x'+combo; comboEl.classList.toggle('on',combo>1); runner.classList.remove('hit');void runner.offsetWidth;runner.classList.add('hit'); if(combo%5===0&&react>620)react-=70; }
    else { lives--; combo=0; comboEl.classList.remove('on'); livesEl.textContent='♥'.repeat(Math.max(0,lives)); runner.classList.remove('stumb');void runner.offsetWidth;runner.classList.add('stumb'); cue.textContent='that was '+LAB[SYS][LANE_DEG[target]-1]; if(lives<=0){return gameOver();} }
    busy=false; T(nextNote, 520); }
  function gameOver(){ playing=false; clearTimers(); gate.style.display='none'; document.getElementById('overttl').textContent='Run over'; document.getElementById('oversub').textContent='Score '+score; over.classList.add('show'); }
  function start(){ over.classList.remove('show'); clearTimers(); score=0;lives=3;combo=0;react=1200;scoreEl.textContent='0';livesEl.textContent='♥♥♥';comboEl.classList.remove('on');trailwrap.innerHTML=''; playing=true; place(); anchorHome(nextNote); }
  document.getElementById('go').onpointerdown=start; document.getElementById('again').onpointerdown=start;
  document.querySelectorAll('#labsys button').forEach(x=>x.onpointerdown=()=>{SYS=x.dataset.s;document.querySelectorAll('#labsys button').forEach(y=>y.classList.toggle('on',y===x));relabel();});
  window.__runner={start,hop,lane:()=>lane,target:()=>target,score:()=>score,playing:()=>playing};
  place();relabel();
})();</script></body></html>
